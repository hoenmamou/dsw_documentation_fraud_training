 response, and needed follow-up. Do not substitute a list of chores or write only no problems. An additional page gives more room; it does not remove the required narrative area from the main form.","kind":"lesson","sources":["ocdd","ocddform"],"form":"ocdd1","id":"lesson-57"},{"section":"ocdd","title":"A note that shows a goal in action","points":["Goal: make shopping choices and compare prices with support.","Support: review a list and compare two prices.","Response: identify the lower price and make a personal choice.","Outcome: describe the assistance still needed."],"narration":"A note that shows a goal in action. Here is a fictional teaching example. At ten thirty, I supported Mr. Lee at the grocery store with his shopping goal. He chose items from his list. I prompted him to compare the prices of two cans of vegetables. He identified the lower price after one reminder and selected his preferred brand. He paid the cashier with assistance counting the change. The note shows a choice and progress without claiming complete independence. Write only the details that actually occurred for your participant.","kind":"lesson","sources":["docdeck","ocdd"],"id":"lesson-58"},{"section":"ocdd","title":"Overnight shifts and extra writing space","points":["Use the service date when the single shift begins.","Identify an overnight shift and clearly show the end date when needed.","Use the additional-notes page when more space is needed.","Identify the beneficiary and service date and sign additional entries."],"narration":"Overnight shifts and extra writing space. The OCDD single-shift format can cover a continuous overnight shift. The service date is the date the shift starts. Check the overnight-shift indicator and make the ending date clear in the documentation when needed, especially for manual times. Do not guess or change times to fit a calendar day. If page one does not provide enough writing space, use the additional-notes page. Enter the beneficiary's name and service date, then identify and sign the staff entry. The extra page is used as needed.","kind":"lesson","sources":["ocdd","ocddform"],"form":"ocdd2","id":"lesson-59"},{"section":"ocdd","title":"Practice: a routine OCDD shift","points":[],"narration":"Practice: a routine OCDD shift. All of the top boxes are checked correctly and the ADL assistance section is complete. May you leave the page-1 progress-note area blank because nothing unusual happened? Option 1. Yes, if the person had no incident. Option 2. Yes, because the checkboxes replace a narrative. Option 3. No. The OCDD single-shift form requires a narrative for every shift, including support toward the care-plan goals. Option 4. Yes, if EVV shows the hours. Choose your answer on the screen.","kind":"check","question":{"prompt":"All of the top boxes are checked correctly and the ADL assistance section is complete. May you leave the page-1 progress-note area blank because nothing unusual happened?","options":["Yes, if the person had no incident","Yes, because the checkboxes replace a narrative","No. The OCDD single-shift form requires a narrative for every shift, including support toward the care-plan goals","Yes, if EVV shows the hours"],"answer":2,"explanation":"The OCDD training requires a narrative every shift. EVV, checkboxes, and ADL entries do not remove that requirement."},"sources":["ocdd"],"id":"lesson-60"},{"section":"ocdd","title":"The documentation rules side by side","points":["OAAS: daily task initials and weekly log completion.","OAAS notes: applicable changes and important care information.","OCDD single shift: top-section checks, written support details, and a narrative each shift.","EVV attestation: supports a manual time entry or correction."],"narration":"The documentation rules side by side. Keep the forms' purposes clear. The OAAS weekly task grid uses signed initials for completed tasks each day. Its notes page addresses applicable changes and important handoff information. The OCDD single-shift form uses checkmarks in the top sections, written assistance descriptions, and a narrative on every shift. The EVV attestation supports a manual time entry or correction; it does not replace the care record. Match the requirements to the participant's program and ask the office when a form or instruction is unclear.","kind":"lesson","sources":["oaas","ocdd","daily","weekly"],"comparison":"rules","id":"lesson-61"},{"section":"evv","title":"EVV and the backup paperwork","points":["EVV means Electronic Visit Verification.","A manual entry needs truthful supporting documentation.","Use the daily or weekly attestation as directed by the office.","Complete the program’s care documentation as well."],"narration":"EVV and the backup paperwork. Electronic Visit Verification records the service visit electronically. Sometimes a DSW cannot clock in or out and the office must review a manual entry or correction. The agency's daily and weekly attestation forms support that process. They do not turn a manual entry into an electronically verified visit, and they do not replace an OAAS service log or OCDD progress note. Report the problem and complete the form the office directs you to use. The care documentation must still describe the actual services.","kind":"lesson","sources":["ocdd","daily","weekly"],"id":"lesson-62"},{"section":"evv","title":"When a clock-in or clock-out fails","points":["Note the actual date, time, participant, and service location.","Notify the office promptly and describe the problem.","Give the actual time, not an automatic scheduled time.","Follow instructions for the visit, attestation, and care record."],"narration":"When a clock-in or clock-out fails. If the system fails, preserve the facts while they are fresh. Note when you actually began or ended care, the participant and location, and the reason the electronic entry failed. Contact the office through the approved channel. A no-service area, phone problem, or emergency needs an accurate explanation. Do not ask another person to clock in for you. Do not assume the office knows about the missed entry. Follow the office's direction so the manual record and the program's service documentation support the same real visit.","kind":"lesson","sources":["daily","weekly","ocdd"],"id":"lesson-63"},{"section":"evv","title":"The daily attestation form","points":["Complete the date, Time-In, and Time Out.","Enter the client’s name and address.","Select or explain the mandatory reason.","Print your name, sign, and date; submit for supervisor review."],"narration":"The daily attestation form. The daily form documents one day's manual entry information. Complete the actual service date, time in, and time out. Include a.m. or p.m. so the times are clear. Enter the client's name and address. Identify the reason, such as lack of service, a phone malfunction, a rural non-service area, an emergency, or another explained reason. Print your DSW name, sign, and date your own attestation. The supervisor section is for the supervisor. The form states that it must be completed in its entirety to be processed.","kind":"lesson","sources":["daily"],"form":"daily1","id":"lesson-64"},{"section":"evv","title":"Practice: a missing reason","points":[],"narration":"Practice: a missing reason. A daily EVV attestation has the correct times and signature, but the reason for the manual entry is blank. Is it ready to process? Option 1. Yes, because the signature is enough. Option 2. No. Complete the mandatory reason and all required fields before submitting. Option 3. Yes, if the shift was scheduled. Option 4. Only if a staff member signs too. Choose your answer on the screen.","kind":"check","question":{"prompt":"A daily EVV attestation has the correct times and signature, but the reason for the manual entry is blank. Is it ready to process?","options":["Yes, because the signature is enough","No. Complete the mandatory reason and all required fields before submitting","Yes, if the shift was scheduled","Only if a staff member signs too"],"answer":1,"explanation":"The daily form specifically makes the reason mandatory and requires complete information. Explain what actually prevented the electronic entry."},"sources":["daily"],"form":"daily1","id":"lesson-65"},{"section":"evv","title":"The weekly attestation form","points":["The supplied form has Week 1 and Week 2 grids.","Put each affected service date in the correct day and week.","Enter the corresponding actual Time-In and Time Out.","Complete client details, reason, DSW signature, and date."],"narration":"The weekly attestation form. The form called weekly in this training has two separate grids labeled Week One and Week Two. Use the affected dates and week the office directs you to document. Enter the actual time in and time out under the proper weekday. Do not let an entry move into the wrong week or imply a visit on an unworked day. Complete the client name and address and explain the reason for the manual entry or edit. Print your name, sign, and date. Submit the form for supervisor review.","kind":"lesson","sources":["weekly"],"form":"weekly1","id":"lesson-66"},{"section":"evv","title":"A manual-entry example","points":["Scheduled visit: 8 a.m. to noon.","Actual care: 8:07 a.m. to 11:52 a.m.","Phone could not connect at the participant’s home.","Report and document 8:07 a.m. to 11:52 a.m."],"narration":"A manual-entry example. This is a fictional example. A visit is scheduled for eight a.m. until noon. You actually begin care at eight oh seven and finish at eleven fifty-two. Your phone cannot connect at the participant's home. Report those actual times and the connection problem to the office and use the required attestation. Do not automatically write the scheduled times. Complete the applicable care record too. On an OCDD single-shift form, manually entered times require the actual times and the service-location indicator.","kind":"lesson","sources":["daily","weekly","ocdd"],"id":"lesson-67"},{"section":"evv","title":"Your signature certifies your information","points":["Read the completed form before signing.","Do not certify guessed times or services you did not provide.","Sign on the actual date you sign.","Ask the office to resolve an inaccurate or incomplete entry."],"narration":"Your signature certifies your information. The agency's attestation says that the information you provide is true and correct. It also warns that false information may lead to legal action and referral for suspected fraud. Read the form before signing, including entries prepared by someone else. Ask for a correction when a date, time, name, or reason is wrong. Do not sign a blank attestation. Your signature date is the date you sign; the date of service belongs in its own field. A supervisor reviews the form rather than certifying your care for you.","kind":"lesson","sources":["daily","weekly"],"id":"lesson-68"},{"section":"evv","title":"Practice: a prepared form is wrong","points":[],"narration":"Practice: a prepared form is wrong. The office sends an attestation showing noon as the end time, but you finished care at 11:52 a.m. What should you do? Option 1. Sign because someone else prepared the form. Option 2. Sign and make a private note later. Option 3. Tell the office about the discrepancy and have it resolved before certifying the information. Option 4. Ask the participant to approve noon. Choose your answer on the screen.","kind":"check","question":{"prompt":"The office sends an attestation showing noon as the end time, but you finished care at 11:52 a.m. What should you do?","options":["Sign because someone else prepared the form","Sign and make a private note later","Tell the office about the discrepancy and have it resolved before certifying the information","Ask the participant to approve noon"],"answer":2,"explanation":"Your signature certifies the information. Resolve an inaccurate time through the office rather than signing a form you know is wrong."},"sources":["daily","weekly"],"id":"lesson-69"},{"section":"elder","title":"Scam prevention belongs at work and at home","points":["Anyone can be targeted, including DSWs.","Fraudsters exploit trust, fear, generosity, or loneliness.","Notice changes without blaming or embarrassing the person.","A calm conversation can help someone ask for support."],"narration":"Scam prevention belongs at work and at home. The Attorney General's elder fraud guide explains that anyone can become a target. The same techniques can affect participants, your parents or grandparents, a friend, or you. A scammer may act caring, official, frightening, or unusually generous. The person's education or life experience does not make them immune. If someone shares a concern, thank them for telling you. Say that scams are designed to fool people and that you can help identify the next step. Shame can make people hide the problem.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 2 and 4–7","id":"lesson-70"},{"section":"elder","title":"What to listen for","points":["“Act right now or something bad will happen.”","“Keep this secret from your family or the bank.”","“Buy gift cards, send cryptocurrency, or move money to a safe account.”","“Tell me your password, verification code, or account number.”"],"narration":"What to listen for. Listen for pressure, secrecy, unusual payment instructions, and requests for private information. A person might say they must buy gift cards today, withdraw a large amount of cash, or keep a new relationship secret. A caller may know family details from social media, use an official-sounding title, or appear on caller ID as the bank. Those details do not prove the story. Pause the transaction. Help the person independently verify who is asking before any money, login code, or personal information is shared.","kind":"lesson","sources":["elder","ftc"],"sourceNote":"Elder Fraud Prevention, PDF pages 4–5 and 12–17","id":"lesson-71"},{"section":"elder","title":"A family emergency or a familiar voice","points":["A caller may pretend to be a child, grandchild, or helper.","A familiar-sounding voice can be faked.","Call the loved one using a number you already trust.","Use a private family code word as an extra check."],"narration":"A family emergency or a familiar voice. Imagine hearing: Grandma, I am in trouble. Please send money and do not tell Mom. The AG guide explains that scammers may imitate relatives and can use voice-cloning technology. Hearing a familiar voice is not enough. End the urgent call and reach the relative using a known number. If needed, contact another trusted family member or verify the supposed agency independently. A private family code word can add a check, but it does not replace verification when the story or payment request is suspicious.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 12–13","id":"lesson-72"},{"section":"elder","title":"Practice: the caller sounds like her grandson","points":[],"narration":"Practice: the caller sounds like her grandson. A participant says her grandson called crying and needs gift cards for bail. He told her to keep it secret. What should you do? Option 1. Help buy the cards because the voice sounds familiar. Option 2. Pause the payment and help verify the story by calling the grandson or a trusted contact at a known number. Option 3. Call only the number the caller supplied. Option 4. Ask the caller for more family details and treat those as proof. Choose your answer on the screen.","kind":"check","question":{"prompt":"A participant says her grandson called crying and needs gift cards for bail. He told her to keep it secret. What should you do?","options":["Help buy the cards because the voice sounds familiar","Pause the payment and help verify the story by calling the grandson or a trusted contact at a known number","Call only the number the caller supplied","Ask the caller for more family details and treat those as proof"],"answer":1,"explanation":"Urgency, secrecy, and gift cards are serious warning signs. Verify through a trusted number. Scammers can use family details and a cloned voice."},"sources":["elder"],"id":"lesson-73"},{"section":"elder","title":"Fake government, bank, and tech-support contacts","points":["Caller ID, logos, and badge numbers can be copied.","Do not share passwords or one-time verification codes.","Do not install remote-access software for an unexpected caller.","Contact the organization using a trusted number or official app."],"narration":"Fake government, bank, and tech-support contacts. An unexpected caller may claim to represent Social Security, the IRS, a bank, or computer support. They may threaten arrest or say an account is under attack. A pop-up may insist that a computer is infected. Do not follow the caller's link, give a verification code, or let them control the device. Close or leave the suspicious contact and reach the organization independently. Use the number on a bank card or a known official source. An urgent demand to pay through gift cards or cryptocurrency is a major warning sign.","kind":"lesson","sources":["elder","ftc"],"sourceNote":"Elder Fraud Prevention, PDF pages 14–17","id":"lesson-74"},{"section":"elder","title":"Romance and companionship scams","points":["A new online relationship becomes intense very quickly.","The person avoids meeting but repeatedly needs money.","A supposed celebrity or friend requests fees or emergency funds.","Offer support and independent verification without ridicule."],"narration":"Romance and companionship scams. A scammer may build a relationship over weeks or months. Then a supposed emergency appears: travel fees, medical bills, a frozen account, or money needed to meet in person. The AG guide also warns about fake celebrity identities. Listen if a participant begins sending money to someone they have never met or becomes secretive about an online relationship. Ask calm questions and encourage a pause. Do not mock the relationship. Help the person use trusted support and report concerns through the appropriate process.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 8–9","id":"lesson-75"},{"section":"elder","title":"Prizes, lotteries, and fake charities","points":["A prize requires an upfront fee, tax, or processing payment.","A solicitor pressures you to donate immediately.","The caller avoids written details or independent verification.","Verify the charity and use its official donation method."],"narration":"Prizes, lotteries, and fake charities. Be alert when someone says they won a prize but must pay first to receive it. A fake charity may use a disaster, a police-sounding name, or an emotional story to rush a donation. The guide advises checking the organization and asking for written information. Do not make a check payable to the individual solicitor or share financial details during an unexpected call. A generous intention does not require an immediate payment. Independently locate the real charity before deciding whether to donate.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 10–11","id":"lesson-76"},{"section":"elder","title":"Investment and quick-money promises","points":["“Guaranteed” high returns with little or no risk.","A limited-time offer that discourages outside advice.","Pressure to use savings, borrow, or send cryptocurrency.","Pause and consult a qualified, independent professional."],"narration":"Investment and quick-money promises. Investment fraud often starts with a sure thing, a secret opportunity, or an online contact offering easy income. Pressure to act before you can ask questions is a warning. Do not recommend an investment to a participant because a caller or online friend showed impressive returns. Encourage the person to verify the promoter and get independent professional advice before committing funds. The AG guide identifies the Louisiana Office of Financial Institutions as a resource for checking securities professionals and reporting investment concerns.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 22–23","id":"lesson-77"},{"section":"elder","title":"Prescription offers and funeral pressure","points":["Treat unusually cheap or “miracle” drug offers cautiously.","Use the person’s approved pharmacy and healthcare team.","Report an unexpected change in medication packaging or appearance.","For funeral purchases, ask for written prices and compare choices."],"narration":"Prescription offers and funeral pressure. The guide warns about unsafe prescription offers and pressure during funeral planning. DSWs should not obtain a participant's medication through an unverified seller or change treatment because of an advertisement. Bring concerns about unfamiliar packaging or tablets to the pharmacist or nurse; appearance alone does not prove counterfeiting. When a family is planning a funeral, encourage them to ask for itemized prices and understand the goods and services before signing. Support a thoughtful decision without taking over the person's financial choices.","kind":"lesson","sources":["elder"],"sourceNote":"Elder Fraud Prevention, PDF pages 18–21","id":"lesson-78"},{"section":"elder","title":"Practice: a bank “safe account”","points":[],"narration":"Practice: a bank “safe account”. A caller says the participant’s bank account is compromised and tells her to move money to a new “safe account.” Which response is safest? Option 1. Follow the caller’s instructions immediately. Option 2. Ask the caller to text a link and use that link. Option 3. End the call and contact the bank using the number on her bank card or a trusted official channel. Option 4. Share the one-time code so the caller can secure the account. Choose your answer on the screen.","kind":"check","question":{"prompt":"A caller says the participant’s bank account is compromised and tells her to move money to a new “safe account.” Which response is safest?","options":["Follow the caller’s instructions immediately","Ask the caller to text a link and use that link","End the call and contact the bank using the number on her bank card or a trusted official channel","Share the one-time code so the caller can secure the account"],"answer":2,"explanation":"Verify independently. A caller’s display name, story, or knowledge of personal details does not prove identity. Never give the caller passwords or verification codes."},"sources":["elder","ftc"],"id":"lesson-79"},{"section":"elder","title":"A practical response when you notice a scam","points":["Listen calmly and help pause further contact or payment.","Verify through a trusted source.","For a participant, notify the office and follow required reporting.","Respect decision-making rights and your role as a DSW."],"narration":"A practical response when you notice a scam. You can say: I am glad you told me. Before any money is sent, let us check this with someone we know is real. Ask permission to help make a call when appropriate. Follow the care plan and agency process for contacting an authorized representative. Report suspected exploitation even when the situation involves someone familiar. Do not take the person's phone, cash, or account access for yourself or assume you have legal control of their decisions. Seek help through the office and the appropriate protective or law-enforcement process.","kind":"lesson","sources":["elder","abuse","report"],"id":"lesson-80"},{"section":"elder","title":"If money or information was already shared","points":["Contact the bank, payment service, or card issuer immediately.","Ask whether the payment can be stopped or reversed.","Secure compromised accounts through trusted help.","Do not pay someone who promises guaranteed recovery."],"narration":"If money or information was already shared. If payment already happened, contact the company used to send it immediately and ask about stopping or reversing it. Recovery is not guaranteed. Keep receipts and relevant messages. If account access or personal information was exposed, use trusted recovery help and notify the bank as appropriate. For a participant, involve the office under agency procedures. The FBI also warns about impostors claiming they can recover lost money. A second request for an upfront recovery fee can be another scam.","kind":"lesson","sources":["ftc","ic3"],"id":"lesson-81"},{"section":"elder","title":"Document the concern without exposing private data","points":["Record dates, the contact method, and what the person reported.","Describe requested payments and your actual response.","Preserve messages and receipts through approved channels.","Keep account numbers, passwords, and codes out of routine notes."],"narration":"Document the concern without exposing private data. A fictional care note might say: At two ten p.m., Ms. Lee reported that a caller requested five hundred dollars in gift cards and told her not to tell her family. With her agreement, we called her daughter using the contact number in the care record. I notified the supervisor at two twenty. No payment was made during my shift. Record only what is true. Preserve evidence as instructed without adding passwords, full bank numbers, or unnecessary private details to ordinary progress notes.","kind":"lesson","sources":["elder","docdeck"],"id":"lesson-82"},{"section":"elder","title":"Use the same habits with family and yourself","points":["Agree on trusted callback numbers and a family code word.","Pause before responding to unexpected money requests.","Keep passwords private and enable additional account protection.","Check unusual transactions with the financial institution."],"narration":"Use the same habits with family and yourself. Take these habits home. Talk with family before an emergency call happens. Agree that anyone can stop and verify a money request without being rude. Store trusted contact numbers and choose a private code word. Be careful about sharing family details publicly online. Keep account credentials private and use additional account protection when available. If you notice something unusual, contact the institution through a trusted channel. You deserve the same patience and support that you would offer a participant.","kind":"lesson","sources":["elder","ftc"],"id":"lesson-83"},{"section":"elder","title":"Choose the right reporting route","points":["Criminal fraud: local law enforcement; online crime: IC3.gov.","Scam reports: ReportFraud.ftc.gov.","Consumer disputes: Louisiana AG at 1-800-351-4889.","Identity theft recovery: IdentityTheft.gov.","For participant exploitation, follow protective-services and agency reporting too."],"narration":"Choose the right reporting route. Different reporting routes serve different purposes. Criminal fraud belongs with law enforcement. Internet-enabled crime can also be reported to the FBI at I C three dot gov. The FTC accepts scam reports at Report Fraud dot F T C dot gov and provides identity-theft recovery at Identity Theft dot gov. The Louisiana Attorney General's Consumer Protection Hotline is one eight hundred, three five one, four eight eight nine. A consumer dispute does not replace a criminal or protective-services report. Participant concerns also go through the agency's required process.","kind":"lesson","sources":["elder","consumer","ic3","ftcreport","identity","report"],"id":"lesson-84"},{"section":"elder","title":"Practice: responding without blame","points":[],"narration":"Practice: responding without blame. A participant tells you she sent money to someone she met online and now feels embarrassed. What should you do first? Option 1. Tell her she should have known better. Option 2. Promise you can recover the money yourself. Option 3. Thank her for telling you, help stop further payments, and promptly involve the office and the relevant payment provider. Option 4. Post the story online to warn everyone. Choose your answer on the screen.","kind":"check","question":{"prompt":"A participant tells you she sent money to someone she met online and now feels embarrassed. What should you do first?","options":["Tell her she should have known better","Promise you can recover the money yourself","Thank her for telling you, help stop further payments, and promptly involve the office and the relevant payment provider","Post the story online to warn everyone"],"answer":2,"explanation":"A calm response helps the person stay engaged. Seek prompt assistance, preserve information through approved channels, and follow reporting requirements. Do not blame, promise recovery, or share private details publicly."},"sources":["elder","ftc"],"id":"lesson-85"},{"section":"finish","title":"Before you submit your records","points":["Correct person, program, date, times, and location.","Care details match what actually happened.","Required initials, signatures, reasons, and notes are complete.","Concerns and discrepancies have been reported."],"narration":"Before you submit your records. Before submitting, check that the paperwork identifies the correct person and program. Make sure dates, actual times, and service location are accurate. Confirm that task entries and notes describe real care and the person's response. Complete each required signature, attestation reason, and narrative. Report concerns and resolve discrepancies through the office. These habits protect the participant, help the next caregiver, and support accurate billing. They also help you explain your work if someone reviews the record later.","kind":"lesson","sources":["oaas","ocdd","daily","weekly","docdeck"],"id":"lesson-86"},{"section":"finish","title":"Ready for your final test","points":["29 questions covering the course.","At least 24 correct answers are required to pass.","Review feedback and retake if needed.","After passing, save or print your completion record."],"narration":"Ready for your final test. You have reached the final test. It covers agency housekeeping, participant protection, Medicaid fraud, documentation, OAAS forms, OCDD progress notes, EVV backup forms, and elder fraud prevention. There are twenty-nine questions, with at least twenty-four correct answers needed to pass. You can use the lesson menu to review completed material. If you do not pass, review the explanation for each missed answer and retake the test. After passing, complete the acknowledgement and save or print your certificate for the office. The record will show your entered name, score, and completion date.","kind":"lesson","id":"lesson-87"}],"exam":[{"section":"protect","prompt":"Your participant needs continuous supervision. The relief DSW has not arrived. What is the appropriate action?","options":["Leave when your scheduled shift ends and document the gap later","Contact the office immediately and follow coverage and safety instructions","Have the participant clock in the relief DSW","Record the scheduled relief time as the actual arrival"],"answer":1,"explanation":"Protect the participant, report the coverage problem immediately, and document the actual events."},{"section":"protect","prompt":"A participant reports that a caregiver threatened them. You have not witnessed the threat. What should you do?","options":["Wait until you witness the same behavior","Discuss it with other participants to see whether they agree","Listen, address safety, document the statement, and follow required reporting","Promise confidentiality even if reporting is required"],"answer":2,"explanation":"A concern does not require your personal proof before reporting. Record the person’s statement without investigating or promising secrecy."},{"section":"protect","prompt":"Your assigned shopping duties include using a participant’s funds. Which practice is appropriate?","options":["Borrow a small amount if you replace it before the next shift","Use the funds for the participant’s authorized needs and follow receipt and change procedures","Combine the participant’s groceries and your purchases without separating the costs","Keep the remaining change as a tip"],"answer":1,"explanation":"The money belongs to the participant. Follow authorized duties and the agency’s money-handling process."},{"section":"fraud","prompt":"A participant agrees that you may leave for another job while remaining clocked in. What does that agreement allow?","options":["The full scheduled shift may still be claimed","Only half the remaining hours may be claimed","It does not authorize false care time; follow the coverage plan and record actual services","The time may be claimed if you write a detailed note"],"answer":2,"explanation":"A participant’s agreement cannot make unprovided services or false time entries valid."},{"section":"fraud","prompt":"You discover an honest time-entry mistake. Which response is appropriate?","options":["Report it promptly and provide accurate information for the supported correction","Create a second record that hides the original mistake","Leave it unchanged because correcting it might draw attention","Ask another DSW to confirm the scheduled time"],"answer":0,"explanation":"Honest errors need truthful, supported correction. Do not conceal them or obtain false confirmation."},{"section":"fraud","prompt":"A shift was scheduled, but the participant’s circumstances changed and the care was not delivered. What should the record show?","options":["The scheduled services because the hours were authorized","A completed visit if a family member signs","The interruption or missed service as it actually occurred, with the office notified","The same task list as the previous shift"],"answer":2,"explanation":"Authorization and scheduling do not prove delivery. Report changes and document the real events."},{"section":"fraud","prompt":"Which statement about a service log is correct?","options":["A signed log can support billing even if the care did not happen","The log must truthfully reflect actual services, regardless of who submits the Medicaid claim","Only the billing employee is responsible for false information","A log may be completed in advance when the tasks are routine"],"answer":1,"explanation":"DSW documentation supports the claim. It must reflect real services and cannot be completed as if future care has already occurred."},{"section":"document","prompt":"Which note best describes a person’s choice and the DSW’s response?","options":["She was stubborn about bathing","Same as usual","At 9 a.m. Ms. Lee declined bathing and requested breakfast first. I offered again at 10 a.m. and assisted with setup when she agreed.","She was in a bad mood but eventually cooperated"],"answer":2,"explanation":"The factual note identifies the offer, choice, time, support, and response without labeling the person."},{"section":"document","prompt":"Who corrects an incorrect entry on the OAAS paper log, and how?","options":["Any supervisor may erase it","The entry’s author uses one readable line, writes error, initials, and enters the correct information","A staff member replaces it and signs the original DSW’s initials","The participant covers it with correction fluid"],"answer":1,"explanation":"The OAAS instructions reserve correction to the individual who made the entry and preserve the original information."},{"section":"document","prompt":"After a medical appointment, a recommendation is unclear. What should you do?","options":["Guess what the provider meant and change the care routine","Clarify the instructions and communicate through the office or nurse as required","Omit the information so no one is confused","Post the visit paperwork in a staff social-media group"],"answer":1,"explanation":"Clarify recommendations, complete required documentation, and communicate through approved channels. Do not independently change treatment."},{"section":"oaas","prompt":"A listed OAAS task was not performed on your shift. What belongs in that task’s daily box?","options":["Your initials because you were present","The participant’s initials","A blank box under the supplied OAAS instructions","A checkmark showing the task was considered"],"answer":2,"explanation":"OAAS task initials certify tasks actually performed that day. The supplied instructions say to leave an unperformed task blank."},{"section":"oaas","prompt":"When are the main OAAS weekly log signatures obtained?","options":["Before the week starts","After the week’s work and documentation are complete","Only when a manual EVV entry is needed","Whenever a family member is available, even on a blank future log"],"answer":1,"explanation":"The participant or authorized representative and the DSW sign and date after the week’s work is complete."},{"section":"oaas","prompt":"A task appears on the CCW PAS form. Does the printed row authorize you to perform it for every participant?","options":["Yes, the blank form is the authorization","Yes, if you initial it afterward","No. Follow that participant’s authorized plan, your training, and agency direction","Only if the LT-PCS form has the same row"],"answer":2,"explanation":"A listed row does not replace the individual’s authorization or the DSW’s required training."},{"section":"ocdd","prompt":"What is required for a routine OCDD single shift with no incident?","options":["EVV alone","Top-section checkmarks alone","Complete applicable support details and the required page-1 narrative for the shift","A narrative only at the end of the week"],"answer":2,"explanation":"OCDD requires a narrative every shift. EVV and checklists do not replace it."},{"section":"ocdd","prompt":"The OCDD clock-out time requires manual entry. What should the documentation include?","options":["EVV in the time-out field even though no electronic clock-out occurred","The actual manual time with a.m./p.m., service location, and required supporting explanation","Only the scheduled time","A staff member’s initials instead of the time"],"answer":1,"explanation":"Manual times require exact information and the Home or Other location indicator. Supporting documentation explains the manual entry or change."},{"section":"ocdd","prompt":"Which entry best describes OCDD ADL support?","options":["Bathing: good","Bathing: checkmark","Set out towels and soap. Ms. Lee washed independently with one verbal reminder to rinse her hair.","Bathing: done as usual"],"answer":2,"explanation":"The description identifies staff support, the person’s independence, and the assistance required."},{"section":"evv","prompt":"The daily attestation has a date, times, and signature but no client address or reason. What should happen?","options":["Submit it because the times are the most important fields","Complete the missing required information before submitting for review","Have another DSW sign to replace the missing information","Use a progress note instead of the attestation"],"answer":1,"explanation":"The daily form requires complete information and a mandatory reason. It supports the manual entry and does not replace program documentation."},{"section":"evv","prompt":"You were scheduled 8 a.m. to noon but actually provided care from 8:07 a.m. to 11:52 a.m. What times do you report for a manual entry?","options":["8 a.m. to noon","8:07 a.m. to noon","8:07 a.m. to 11:52 a.m.","Any times the participant agrees to sign"],"answer":2,"explanation":"Document the actual service beginning and end. Scheduled times do not substitute for actual care time."},{"section":"elder","prompt":"A caller sounds like a relative and asks for secret emergency gift-card payments. What is the safest next step?","options":["Pay first and verify later","End the call and verify through a known number for the relative or trusted contact","Use the caller’s callback number as the only verification","Give the caller family details to test their answers"],"answer":1,"explanation":"Voice cloning and public family information can make a scam convincing. Verify independently before paying."},{"section":"elder","prompt":"An unexpected bank caller requests a one-time login code and says to move savings to a safe account. What should you do?","options":["Share the code so the account can be secured","Follow the instructions because the caller ID shows the bank","Stop the contact and reach the bank through a trusted official channel","Install the remote-access app the caller recommends"],"answer":2,"explanation":"Caller ID can be spoofed. Keep codes private and verify through the number on a bank card or another trusted source."},{"section":"elder","prompt":"A participant’s new online companion repeatedly asks for money but avoids meeting. What is an appropriate DSW response?","options":["Ridicule the relationship so the participant stops talking to the person","Encourage a pause, discuss the warning signs respectfully, and follow the office’s reporting process","Send money for the participant to prove you support the relationship","Take permanent control of the participant’s phone and accounts"],"answer":1,"explanation":"Money requests and avoidance are warning signs. Respond calmly and respect the person’s rights while seeking appropriate help."},{"section":"elder","prompt":"A caller says a participant won a prize but must first pay a processing fee. What should raise concern?","options":["The required upfront payment to receive the prize","The participant has a telephone","The call arrived during business hours","The caller used a polite voice"],"answer":0,"explanation":"Upfront payment demands and pressure to act are warning signs identified in the AG guide."},{"section":"elder","prompt":"A participant already sent money to a suspected scammer. Which action is appropriate?","options":["Wait until next month to see whether the money returns","Contact the relevant payment provider promptly, involve the office, preserve records, and follow reporting requirements","Pay a recovery service that guarantees a refund","Delete messages so the participant does not have to see them"],"answer":1,"explanation":"Prompt contact may help stop or reverse a payment, but recovery is not guaranteed. Preserve evidence and avoid recovery impostors."},{"section":"elder","prompt":"A participant feels ashamed about a suspected scam. Which response is most helpful?","options":["Tell them they should have known better","Share the story with neighbors to teach them a lesson","Thank them for telling you, listen without blame, and help connect them with the appropriate support","Promise that you will keep everything secret regardless of reporting duties"],"answer":2,"explanation":"A respectful response supports disclosure and action. Protect privacy and follow required reporting without blame or false promises."},{"section":"housekeeping","prompt":"Which outfit meets the agency’s standard uniform expectations?","options":["Leggings and a tank top","Clean medical scrubs, a visible agency ID badge, and closed-toe shoes","Sweatpants and slides","A midriff top with a scrub jacket"],"answer":1,"explanation":"Medical scrubs are the standard. Keep the ID visible and wear closed-toe shoes. The handbook’s specific coordinated-outfit exceptions do not allow prohibited clothing."},{"section":"housekeeping","prompt":"Two DSWs want to swap shifts. What makes the change approved?","options":["Both staff members agree privately","The participant says it is fine","The office or supervisor reviews and approves the change","One staff member sends a text after the shift starts"],"answer":2,"explanation":"Shift changes and coverage go through the office or supervisor. Wait for approval before changing the schedule."},{"section":"housekeeping","prompt":"A participant is upset and a family member begins raising a concern. What is the appropriate DSW response?","options":["Raise your voice so everyone listens","Argue about who is right","Keep a calm tone, follow the participant’s support plan, and contact the supervisor for unresolved concerns","Discuss another DSW’s shortcomings with the family"],"answer":2,"explanation":"Respond calmly and respectfully. Follow the plan, protect confidentiality, and use the supervisor for unresolved care or staffing concerns."},{"section":"housekeeping","prompt":"A staff member’s shift has ended and a chore is unfinished. What should you do?","options":["Order the staff member to return and finish it off the clock","Yell at the staff member in the participant’s home","Ask the participant to discipline the staff member","Share the facts calmly and notify the supervisor to resolve the unfinished work"],"answer":3,"explanation":"Peers do not assign after-shift work hours. Keep required care covered, report unresolved work to the supervisor, and record actual work time."},{"section":"housekeeping","prompt":"During 24-hour overnight care, the participant is settled in bed. You want to make a personal trip to a store. What is appropriate?","options":["Take the participant along so they are not alone","Leave briefly while the participant sleeps","Stay in the home and provide required supervision; do not make the personal trip","Ask a family member to approve your personal errand instead of using the agency process"],"answer":2,"explanation":"Do not take a participant on personal errands or leave required coverage. Once the participant is settled in bed, an overnight departure with them is for an emergency under the emergency plan."}],"retiredExamIndex":17,"resources":{"ccw":{"title":"CCW PAS log","description":"Actual two-page OAAS CCW service log supplied by the agency.","filename":"CCW_Service_Log.pdf","mime":"application/pdf","format":"PDF"},"ltpcs":{"title":"LT-PCS log","description":"Actual two-page OAAS LT-PCS service log supplied by the agency.","filename":"LTPCS_Service_Log.pdf","mime":"application/pdf","format":"PDF"},"oaas_instructions":{"title":"OAAS service-log instructions","description":"Four-page instructions supplied for both CCW PAS and LT-PCS.","filename":"OAAS_Service_Log_Instructions.pdf","mime":"application/pdf","format":"PDF"},"ocddform":{"title":"OIDD single-shift progress note","description":"Current single-shift form and additional-notes page, revised July 10, 2026.","filename":"OIDD_Single_Shift_Progress_Note.pdf","mime":"application/pdf","format":"PDF"},"daily":{"title":"Daily EVV attestation","description":"Original editable agency form for daily manual-entry support.","filename":"Daily_EVV_Attestation.docx","mime":"application/vnd.openxmlformats-officedocument.wordprocessingml.document","format":"DOCX"},"weekly":{"title":"Weekly EVV attestation","description":"Original editable agency form containing Week 1 and Week 2 grids.","filename":"Weekly_EVV_Attestation.docx","mime":"application/vnd.openxmlformats-officedocument.wordprocessingml.document","format":"DOCX"},"elder":{"title":"AG Elder Fraud Prevention guide","description":"Optimized copy of the supplied 28-page handout for participants, family, and staff.","filename":"AG_Elder_Fraud_Prevention.pdf","mime":"application/pdf","format":"PDF"},"ocdd_guidance":{"title":"OCDD documentation guidance","description":"51-page LDH presentation used in prior agency work; this course focuses on single-shift documentation.","filename":"OCDD_Documentation_Guidance.pdf","mime":"application/pdf","format":"PDF"}},"forms":{"ccw1":{"caption":"CCW PAS log · page 1","alt":"Blank agency reference form: CCW PAS log · page 1","resource":"ccw"},"ccw2":{"caption":"CCW PAS progress notes · page 2","alt":"Blank agency reference form: CCW PAS progress notes · page 2","resource":"ccw"},"ltpcs1":{"caption":"LT-PCS log · page 1","alt":"Blank agency reference form: LT-PCS log · page 1","resource":"ltpcs"},"ltpcs2":{"caption":"LT-PCS progress notes · page 2","alt":"Blank agency reference form: LT-PCS progress notes · page 2","resource":"ltpcs"},"ocdd1":{"caption":"OIDD single-shift progress note · page 1","alt":"Blank agency reference form: OIDD single-shift progress note · page 1","resource":"ocddform"},"ocdd2":{"caption":"OIDD additional-notes page","alt":"Blank agency reference form: OIDD additional-notes page","resource":"ocddform"},"daily1":{"caption":"Daily EVV attestation","alt":"Blank agency reference form: Daily EVV attestation","resource":"daily"},"weekly1":{"caption":"Weekly EVV attestation · two week grids","alt":"Blank agency reference form: Weekly EVV attestation · two week grids","resource":"weekly"}},"tracking":{"url":"https://hubvxtzwmgigmvhyygae.supabase.co","anonKey":"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh1YnZ4dHp3bWdpZ212aHl5Z2FlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NDk5MjQsImV4cCI6MjEwMzQyNTkyNH0.UJSW_ibGs3G5OK-9iI80lDMLD7IXD9c9-lk5L_Wpc6M"},"edition":"2026-11-03"}</script>
<script>
(async function loadCourse(){
 const response = await fetch('reference-assets.txt');
 if(!response.ok) throw new Error('Reference materials could not be loaded');
 const reference = (await response.text()).match(/<script id="course-data" type="application\/json">([\s\S]*?)<\/script>/);
 const original = JSON.parse(reference[1]);
 const node = document.getElementById('course-data');
 const data = JSON.parse(node.textContent);
 data.logo = original.logo;
 for(const [key, item] of Object.entries(data.resources)) item.base64 = original.resources[key].base64;
 for(const [key, item] of Object.entries(data.forms)) item.image = original.forms[key].image;
 node.textContent = JSON.stringify(data);

'use strict';
const COURSE=JSON.parse(document.getElementById('course-data').textContent);
const VERSION='hoen-dsw-protection-2026-11-03-v2-housekeeping';
const PREVIOUS_VERSION='hoen-dsw-protection-2026-11-03-v1';
const STORAGE_KEY='hoen-training:'+VERSION;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const letters=['A','B','C','D'];
function shuffled(a){const x=[...a];for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]];}return x;}
function id(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);}
function blankState(name=''){return {version:VERSION,name,cursor:0,heard:'0'.repeat(COURSE.slides.length),checks:'0'.repeat(COURSE.slides.length),seconds:0,attempts:0,exam:null,result:null,pass:null,voice:'auto',rate:1,autoplay:true,started:new Date().toISOString()};}
function reviseSavedTest(record){
 if(!record || !Array.isArray(record.order) || record.order.length !== COURSE.exam.length + 1) return record;
 const retired = COURSE.retiredExamIndex;
 const removedPosition = record.order.indexOf(retired);
 if(removedPosition < 0) return record;
 const keep = (_, position) => position !== removedPosition;
 const revised = {
  ...record,
  order: record.order.filter(keep).map(index => index > retired ? index - 1 : index),
  answers: record.answers.filter(keep)
 };
 if(record.options) revised.options = record.options.filter(keep);
 if(Number.isInteger(record.cursor)){
  const cursor = record.cursor - Number(removedPosition < record.cursor);
  revised.cursor = Math.min(cursor, revised.order.length - 1);
 }
 return revised;
}
function normalizeState(s){
if(s?.version===PREVIOUS_VERSION&&typeof s.name==='string'){
 const added=COURSE.slides.filter(x=>x.section==='housekeeping').length,oldLength=COURSE.slides.length-added;
 const extend=bits=>{const original=String(bits||'').padEnd(oldLength,'0').slice(0,oldLength).replace(/[^01]/g,'0');return original.slice(0,2)+'0'.repeat(added)+original.slice(2);};
 s={...s,version:VERSION,heard:extend(s.heard),checks:extend(s.checks),cursor:2,attempts:0,exam:null,result:null,pass:null,tracking:null,migratedFrom:PREVIOUS_VERSION};
}
if(!s||s.version!==VERSION||typeof s.name!=='string')return null;const d=blankState(s.name.slice(0,100));Object.assign(d,s);d.heard=String(d.heard||'').padEnd(COURSE.slides.length,'0').slice(0,COURSE.slides.length).replace(/[^01]/g,'0');d.checks=String(d.checks||'').padEnd(COURSE.slides.length,'0').slice(0,COURSE.slides.length).replace(/[^01]/g,'0');d.cursor=Math.max(0,Math.min(COURSE.slides.length-1,Number(d.cursor)||0));d.seconds=Math.max(0,Number(d.seconds)||0);d.voice=typeof d.voice==='string'&&d.voice?d.voice:'auto';d.rate=[.85,1,1.15].includes(Number(d.rate))?Number(d.rate):1;
d.exam = reviseSavedTest(d.exam);
d.result = reviseSavedTest(d.result);
return d;}
let storageOK=true,state=null,view='welcome',voices=[],questionOrder=[],lastActivity=Date.now(),timerLast=Date.now(),sessionSeconds=0,lmsConfirmed=false;
let speech={playing:false,paused:false,chunks:[],at:0,token:0,utterance:null,watchdog:null,voiceTimer:null,pending:false};
function getLMS(){for(const start of [window,window.opener]){let w=start;for(let i=0;w&&i<10;i++){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent;}catch(_){break;}}}return null;}
const LMS={api:getLMS(),ready:false,status:'',initialize(){try{if(this.api&&String(this.api.LMSInitialize(''))==='true'){this.ready=true;this.status=this.api.LMSGetValue('cmi.core.lesson_status');return this.api.LMSGetValue('cmi.suspend_data');}}catch(_){}return '';},get(key){try{return this.ready?this.api.LMSGetValue(key):'';}catch(_){return '';}},set(key,value){try{return this.ready&&String(this.api.LMSSetValue(key,String(value)))==='true';}catch(_){return false;}},commit(){try{return this.ready&&String(this.api.LMSCommit(''))==='true';}catch(_){return false;}},finish(){if(!this.ready)return;syncLMS();try{this.api.LMSFinish('');}catch(_){}this.ready=false;}};
function toLMSTime(t){t=Math.max(0,Math.floor(t));return String(Math.floor(t/3600)).padStart(4,'0')+':'+String(Math.floor(t%3600/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')+'.00';}
function syncLMS(){if(!state||!LMS.ready)return false;const raw=JSON.stringify(state);if(raw.length<=4000)LMS.set('cmi.suspend_data',raw);LMS.set('cmi.core.lesson_location',String(state.cursor));LMS.set('cmi.core.session_time',toLMSTime(sessionSeconds));LMS.set('cmi.core.exit','suspend');if(state.result){LMS.set('cmi.core.score.min','0');LMS.set('cmi.core.score.max','100');LMS.set('cmi.core.score.raw',String(state.pass?state.pass.score:state.result.score));}let ok=true;if(state.pass&&allComplete()&&state.pass.score>=80)ok=LMS.set('cmi.core.lesson_status','passed');else if(state.result&&state.result.score<80&&!state.pass)ok=LMS.set('cmi.core.lesson_status','failed');else if(LMS.status!=='passed')ok=LMS.set('cmi.core.lesson_status','incomplete');const committed=LMS.commit();return ok&&committed;}
function persist(sync=false){if(!state)return;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){storageOK=false;$('storage-warning').hidden=false;}if(sync)syncLMS();}
const lmsData=LMS.initialize();try{state=normalizeState(JSON.parse(lmsData||localStorage.getItem(STORAGE_KEY)||localStorage.getItem('hoen-training:'+PREVIOUS_VERSION)||'null'));}catch(_){state=null;}
function markBit(key,i){state[key]=state[key].slice(0,i)+'1'+state[key].slice(i+1);persist(true);}
function isComplete(i){return state&&state.heard[i]==='1'&&(COURSE.slides[i].kind!=='check'||state.checks[i]==='1');}
function completedCount(){return COURSE.slides.reduce((n,_,i)=>n+Number(isComplete(i)),0);}
function allComplete(){return completedCount()===COURSE.slides.length;}
function frontier(){const i=COURSE.slides.findIndex((_,i)=>!isComplete(i));return i<0?COURSE.slides.length-1:i;}
function sayStatus(text){$('live-status').textContent=text;}
function stopSpeech(){speech.token++;speech.playing=false;speech.paused=false;speech.pending=false;clearTimeout(speech.watchdog);clearTimeout(speech.voiceTimer);speech.watchdog=null;speech.voiceTimer=null;try{window.speechSynthesis?.cancel();}catch(_){}speech.utterance=null;}
function splitSpeech(text){let parts=[];try{parts=Array.from(new Intl.Segmenter('en',{granularity:'sentence'}).segment(text),x=>x.segment.trim()).filter(Boolean);}catch(_){parts=text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[text];}const chunks=[];let hold='';for(const p of parts){const words=p.split(/\s+/);for(let at=0;at<words.length;at+=36){const part=words.slice(at,at+36).join(' ');if((hold+' '+part).length>260&&hold){chunks.push(hold);hold=part;}else hold+=(hold?' ':'')+part;}}if(hold)chunks.push(hold);return chunks;}
function narrationVoiceChoices(){
 voices=window.speechSynthesis?.getVoices?.()||[];
 const english=voices.filter(v=>/^en(?:[-_]|$)/i.test(v.lang||''));
 const family=v=>/\bZira\b/i.test(v.name)?'zira':/\bDavid\b/i.test(v.name)?'david':/\bMark\b/i.test(v.name)?'mark':String(v.name).toLowerCase();
 const rank=v=>family(v)==='zira'?0:family(v)==='david'?1:family(v)==='mark'?2:/Google US English|\bAria\b/i.test(v.name)?3:4;
 const ordered=[...english].sort((a,b)=>rank(a)-rank(b)||Number(/Desktop/i.test(b.name))-Number(/Desktop/i.test(a.name)));
 const result=[],seen=new Set();
 for(const voice of ordered){const key=family(voice);if(seen.has(key))continue;seen.add(key);result.push(voice);if(result.length===4)break;}
 return result;
}
function selectedNarrationVoice(){
 const choices=narrationVoiceChoices();const requested=state?.voice||'auto';
 if(requested==='auto')return choices.find(v=>/\bDavid\b/i.test(v.name))||choices[0]||null;
 if(requested==='zira')return choices.find(v=>/\bZira\b/i.test(v.name))||null;
 return choices.find(v=>v.voiceURI===requested)||null;
}
function populateVoices(){
 const choices=narrationVoiceChoices(),selected=selectedNarrationVoice(),select=$('voice-select'),label=$('voice-availability');
 if(selected&&state&&['auto','zira'].includes(state.voice)){state.voice=selected.voiceURI;persist();}
 if(select){
  select.innerHTML=choices.length?choices.map(v=>'<option value="'+esc(v.voiceURI)+'">'+esc(v.name)+'</option>').join(''):'<option value="">No English voice available</option>';
  select.disabled=!choices.length;
  if(selected)select.value=selected.voiceURI;
  else if(choices.length){select.insertAdjacentHTML('afterbegin','<option value="__unavailable" disabled selected>Choose an available voice</option>');select.value='__unavailable';}
 }
 if(label)label.textContent=selected?'Up to four installed English voices':choices.length?'Select a voice to continue':'Enable an English speech voice in your browser or device';
 if(speech.pending&&selected)startSpeech();
}
if('speechSynthesis'in window){window.speechSynthesis.onvoiceschanged=populateVoices;}
function narrationText(){if(view==='exam'){const q=examQuestion();return 'Final test. Question '+(state.exam.cursor+1)+'. '+q.prompt+' '+state.exam.options[state.exam.cursor].map((n,i)=>'Option '+(i+1)+'. '+q.options[n]+'.').join(' ');}const s=COURSE.slides[state.cursor];if(s.kind==='check')return s.title+'. '+s.question.prompt+' '+questionOrder.map((n,i)=>'Option '+(i+1)+'. '+s.question.options[n]+'.').join(' ')+' Choose your answer on the screen.';return s.narration;}
function audioUI(){if(!$('play-btn'))return;$('play-btn').textContent=speech.playing?(speech.paused?'Continue narration':'Pause narration'):(view==='exam'?'Read question aloud':state.heard[state.cursor]==='1'?'Replay narration':'Play narration');const p=$('narration-progress');if(p)p.style.width=(speech.chunks.length?100*speech.at/speech.chunks.length:0)+'%';}
function audioError(message){stopSpeech();audioUI();if($('audio-note'))$('audio-note').textContent=message;if($('nav-message'))$('nav-message').textContent='Narration needs to finish before you continue. Your place is saved.';sayStatus(message);}
function startSpeech(){
 stopSpeech();
 if(!('speechSynthesis'in window)||typeof SpeechSynthesisUtterance==='undefined'){
  audioError('Narration requires browser speech support. Open the course in a current Chrome or Edge browser with an English voice enabled.');return;
 }
 const selected=selectedNarrationVoice();
 if(!selected){
  speech.pending=true;const token=speech.token;
  if($('audio-note'))$('audio-note').textContent='Checking available narration voices…';
  speech.voiceTimer=setTimeout(()=>{
   if(token!==speech.token||!speech.pending)return;
   speech.pending=false;
   if(selectedNarrationVoice()){startSpeech();return;}
   audioError('The selected narration voice is unavailable. Choose an available English voice, or enable an English speech voice on this device, then choose Play narration.');
  },1200);
  populateVoices();return;
 }
 const spokenText = narrationText()
  .replace(/\bLT-PCS\b/g, 'L T P C S')
  .replace(/\bCCW PAS\b/g, 'C C W P A S');
 speech.chunks=splitSpeech(spokenText);speech.at=0;speech.playing=true;speech.paused=false;
 const token=speech.token,slideAt=state.cursor,isExam=view==='exam',synth=window.speechSynthesis;
 const next=()=>{
  if(token!==speech.token||!speech.playing)return;
  if(speech.at>=speech.chunks.length){
   speech.playing=false;speech.paused=false;clearTimeout(speech.watchdog);
   if(!isExam&&view==='lesson'&&state.cursor===slideAt){markBit('heard',slideAt);updateNavigation();updateProgress();if($('audio-note'))$('audio-note').textContent=COURSE.slides[slideAt].kind==='check'&&state.checks[slideAt]!=='1'?'Narration complete. Choose the best answer to continue.':'Narration complete. You may continue.';}
   else if($('audio-note'))$('audio-note').textContent='Question narration complete.';
   audioUI();return;
  }
  const chosen=selectedNarrationVoice();
  if(!chosen){audioError('The selected voice became unavailable. Choose another available voice and replay this lesson.');return;}
  const u=new SpeechSynthesisUtterance(speech.chunks[speech.at]);speech.utterance=u;
  u.voice=chosen;u.lang=chosen.lang||'en-US';u.rate=state.rate||1;

function sourcesMarkup(keys){return keys.map(key=>{const s=COURSE.sources[key];if(!s)return '';return '<section class="source-entry"><strong>'+esc(s.title)+'</strong><p>'+esc(s.detail||'')+'</p>'+(s.url?'<a href="'+esc(s.url)+'" target="_blank" rel="noopener noreferrer">Open source</a>':'')+(s.resource&&COURSE.resources[s.resource]?' <button class="link" data-download="'+s.resource+'">Download reference</button>':'')+'</section>';}).join('');}
function openSources(keys){showDialog('Lesson sources',sourcesMarkup(keys));bindDownloads();}
function bindDownloads(){document.querySelectorAll('[data-download]').forEach(b=>b.onclick=()=>downloadResource(b.dataset.download));}
function openResources(tab='forms'){const nav='<div class="resource-tabs"><button id="tab-forms"'+(tab==='forms'?' class="primary"':'')+'>Forms & handouts</button><button id="tab-sources"'+(tab==='sources'?' class="primary"':'')+'>Course sources</button><button id="tab-contacts"'+(tab==='contacts'?' class="primary"':'')+'>Reporting contacts</button></div>';let body='';if(tab==='forms'){body='<p>Download the actual blank forms supplied for this training. Use the correct program form and follow office instructions.</p><div class="resource-list">'+Object.entries(COURSE.resources).map(([key,r])=>'<div class="resource-row"><div><strong>'+esc(r.title)+'</strong><p>'+esc(r.description)+'</p></div><button class="small" data-download="'+key+'">Download '+esc(r.format)+'</button></div>').join('')+'</div>';}else if(tab==='sources'){body='<p class="muted">Course edition: November 3, 2026. AG case examples are arrest announcements and describe allegations. The training uses the uploaded forms and single-shift OCDD practices.</p>'+sourcesMarkup(Object.keys(COURSE.sources));}else{body='<div class="table-wrap"><table class="comparison"><thead><tr><th>Concern</th><th>Contact or next step</th></tr></thead><tbody><tr><th>Immediate danger</th><td>911</td></tr><tr><th>Agency office</th><td><a href="tel:3374682730">337-468-2730</a></td></tr><tr><th>Child abuse or neglect</th><td>1-855-452-5437 and local law enforcement</td></tr><tr><th>Abuse or exploitation, ages 18–59</th><td>APS: 1-800-898-4910 and local law enforcement</td></tr><tr><th>Abuse or exploitation, ages 60+</th><td>EPS: 1-833-577-6532 and local law enforcement</td></tr><tr><th>Medicaid provider fraud</th><td>MFCU: 1-888-799-6885 or 225-326-6210</td></tr><tr><th>Criminal consumer fraud</th><td>Local law enforcement; contact the relevant payment provider immediately if money was sent</td></tr><tr><th>Louisiana consumer disputes</th><td>AG Consumer Protection: 1-800-351-4889</td></tr><tr><th>Online crime</th><td><a href="https://www.ic3.gov/" target="_blank" rel="noopener noreferrer">IC3.gov</a></td></tr><tr><th>Scam reports</th><td><a href="https://reportfraud.ftc.gov/" target="_blank" rel="noopener noreferrer">ReportFraud.ftc.gov</a></td></tr><tr><th>Identity-theft recovery</th><td><a href="https://www.identitytheft.gov/" target="_blank" rel="noopener noreferrer">IdentityTheft.gov</a></td></tr></tbody></table></div><p class="status-note">Contacts checked November 3, 2026. Follow required agency and program incident reporting in addition to the appropriate outside report.</p>';}showDialog('Forms and resources',nav+body);$('tab-forms').onclick=()=>{closeDialog();openResources('forms');};$('tab-sources').onclick=()=>{closeDialog();openResources('sources');};$('tab-contacts').onclick=()=>{closeDialog();openResources('contacts');};bindDownloads();}
function closeDialog(){$('resource-dialog').close();}
function showHelp(){showDialog('Using this training','<div class="instructor-copy"><h3>For learners</h3><ol><li>Download the HTML course and open it in a current Chrome or Edge browser. Turn on sound.</li><li>Enter your full name and choose Start. Use the Voice menu to choose from up to four available English voices. Next unlocks after narration finishes and any checkpoint is answered correctly.</li><li>Use Pause or the lesson menu to review. Returning to the same browser normally restores your place.</li><li>Complete the final test, acknowledge the training, and print or save your certificate.</li></ol><p>Narration choices depend on the English voices available to your browser. Zira, David, and Mark appear when installed; an additional English voice may also be offered. Choose a voice and replay if narration stops. Keep this tab open if a storage warning appears.</p><h3>For the training administrator</h3><p>The standalone HTML contains the entire course and embedded reference forms. It needs no additional web files. Lesson progress is stored on the learner’s browser. After passing and acknowledgement, completion details are sent to the agency’s existing training-completion records. Learners should wait for the save confirmation and keep a certificate copy.</p><p>The separate SCORM 1.2 ZIP can be imported into a learning system that supports SCORM 1.2. It reports the final score and passing completion, bookmarks progress, and records session time through the host’s SCORM API. Use the ZIP’s README for upload details.</p><p>The OCDD section reinforces the previous agency course. Completion records from this downloaded course must be submitted according to the office’s instructions.</p><p>Agency office: 337-468-2730.</p></div>');}
let completionRequest=null;
function updateCompletionStatus(){
 const label=$('completion-save-status'),retry=$('retry-completion');
 if(!label||!state?.pass)return;
 const saved=state.tracking?.certificate===state.pass.id&&state.tracking.status==='saved';
 const failed=state.tracking?.certificate===state.pass.id&&state.tracking.status==='error';
 label.textContent=saved?'Completion recorded successfully. Save your certificate for your records.':failed?'Your certificate is ready, but the completion record has not been saved. Check your connection and choose Retry. Notify the office if it still cannot save.':'Recording your completion… Please keep this page open for confirmation.';
 label.classList.toggle('error',Boolean(failed));
 if(retry)retry.hidden=!failed;
}
function ensureCompletionSaved(){
 if(!state?.pass||!allComplete()||state.pass.score<80||!state.pass.acknowledged)return Promise.resolve(false);
 const certificate=state.pass.id;
 if(state.tracking?.certificate===certificate&&state.tracking.status==='saved'){updateCompletionStatus();return Promise.resolve(true);}
 if(completionRequest?.certificate===certificate)return completionRequest.promise;
 const learner=state;
 const payload={employee_name:state.pass.name.trim(),training_name:COURSE.title,score:state.pass.score,passed:true,attempts:state.pass.attempt||1,certificate_number:certificate};
 if(!payload.employee_name)return Promise.resolve(false);
 learner.tracking={certificate,status:'pending'};persist(true);updateCompletionStatus();
 const promise=(async()=>{
  let timeout=null;
  try{
   const controller=new AbortController();
   timeout=setTimeout(()=>controller.abort(),15000);
   const response=await fetch(COURSE.tracking.url+'/rest/v1/training_completions',{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:COURSE.tracking.anonKey,Authorization:'Bearer '+COURSE.tracking.anonKey,Prefer:'return=minimal'},
    body:JSON.stringify(payload),signal:controller.signal
   });
   if(!response.ok)throw new Error('Completion log error '+response.status);
   learner.tracking={certificate,status:'saved',saved_at:new Date().toISOString()};
   if(state===learner){persist(true);updateCompletionStatus();}
   return true;
  }catch(error){
   learner.tracking={certificate,status:'error'};
   if(state===learner){persist(true);updateCompletionStatus();}
   return false;
  }finally{
   clearTimeout(timeout);
   if(completionRequest?.certificate===certificate)completionRequest=null;
  }
 })();
 completionRequest={certificate,promise};
 return promise;
}

$('header-logo').src=COURSE.logo;$('resources-btn').onclick=()=>openResources();$('help-btn').onclick=showHelp;$('dialog-close').onclick=closeDialog;$('resource-dialog').addEventListener('click',e=>{if(e.target===$('resource-dialog')){const r=$('resource-dialog').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
['pointerdown','keydown','touchstart'].forEach(type=>document.addEventListener(type,()=>{lastActivity=Date.now();},{passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&speech.playing&&!speech.paused){window.speechSynthesis.pause();speech.paused=true;clearTimeout(speech.watchdog);audioUI();if($('audio-note'))$('audio-note').textContent='Narration paused while the page was hidden. Choose Continue narration.';}persist(true);timerLast=Date.now();});
setInterval(()=>{const now=Date.now();const elapsed=Math.min(20,(now-timerLast)/1000);timerLast=now;if(state&&view!=='welcome'&&view!=='certificate'&&!document.hidden&&((speech.playing&&!speech.paused)||now-lastActivity<120000)){state.seconds+=elapsed;sessionSeconds+=elapsed;persist(false);}if(state&&LMS.ready)syncLMS();},15000);
window.addEventListener('pagehide',()=>{stopSpeech();persist();LMS.finish();});
document.addEventListener('keydown',e=>{if(e.altKey&&view==='lesson'&&!$('resource-dialog').open){if(e.key==='ArrowRight'){e.preventDefault();nextLesson();}if(e.key==='ArrowLeft'&&state.cursor>0){e.preventDefault();goLesson(state.cursor-1,true);}}});
welcome();

})().catch(error => {
 console.error(error);
 document.getElementById('app').textContent = 'The course could not load. Refresh this page to try again.';
});
</script>
