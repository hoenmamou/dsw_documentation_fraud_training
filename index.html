<style>
:root{
  color-scheme:dark;
  --ground:#0D1615;--surface:#152220;--surface-2:#1D2C29;--matte:#080F0E;
  --line:#2A3A37;--line-strong:#3C4E4A;
  --text:#E7EDEB;--text-2:#AEBCB8;--text-3:#83918D;
  --accent:#4FB3AE;--accent-soft:#16302E;--accent-ink:#8FD3CF;
  --good:#5FBE97;--good-soft:#132C24;--warn:#D2A253;--warn-soft:#2E2415;
  --bad:#DE8878;--bad-soft:#31201C;--new:#B49AE0;--new-soft:#231C33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  --ink:var(--text);--navy:var(--text);--teal:var(--accent);--teal2:var(--accent-soft);
  --gold:var(--warn);--paper:var(--ground);--muted:var(--text-2);--danger:var(--bad);--focus:var(--accent);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--text);font:16px/1.55 var(--f-sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button,a,input,select,summary{touch-action:manipulation}
button{cursor:pointer;border:1px solid var(--line-strong);border-radius:8px;padding:.7em 1.2em;background:var(--surface);font-size:15px;font-weight:600;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
button:disabled{cursor:not-allowed;color:var(--text-3);background:var(--surface-2);border-color:var(--line)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover:not(:disabled){background:#398E8A;border-color:#398E8A}
button.primary:disabled{background:var(--surface-2);border-color:var(--line);color:var(--text-3)}
button.small{font-size:13px;padding:7px 11px}
button.link{border:0;padding:4px 0;background:none;text-decoration:underline;text-underline-offset:3px;font-weight:500}
a{color:var(--accent-ink);text-underline-offset:3px}a:hover{color:var(--text)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:4px}
h1,h2,h3,p{margin-top:0}p{margin-bottom:18px}
h1,h2{font-family:var(--f-display);font-weight:700;text-wrap:balance;line-height:1.2;letter-spacing:-.015em}
h1{font-size:clamp(32px,4.8vw,50px)}h2{font-size:clamp(24px,3.3vw,36px);margin-bottom:22px}h3{font-size:18px}
.muted{color:var(--text-2)}.kicker,.eyebrow{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.hidden,[hidden]{display:none!important}.skip{position:absolute;left:15px;top:-70px;background:var(--surface);padding:8px;z-index:100}.skip:focus{top:10px}

/* The established course welcome screen. */
.welcome{max-width:1120px;margin:0 auto;padding:clamp(30px,6vw,64px) 20px 44px}
.intro{display:grid;grid-template-columns:1.15fr .85fr;gap:clamp(28px,5vw,64px);align-items:start}
.welcome h1{margin:.35em 0 .3em}.intro-copy{font-size:18px;color:var(--text-2);max-width:56ch;margin:0}
.updatebox{background:var(--new-soft);border-left:3px solid var(--new);border-radius:8px;padding:15px 18px;margin-top:26px;font-size:14.5px;line-height:1.6;color:var(--text-2)}
.updatebox strong{color:var(--text)}.rule{height:1px;background:var(--line);margin:26px 0}
.facts{display:grid;border-top:1px solid var(--line);margin:0}
.fact{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);align-items:baseline}
.fact dt{font-family:var(--f-mono);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3)}
.fact dd{margin:0;font-size:15px;color:var(--text-2)}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:26px}
.entry h2{font-size:20px;margin-bottom:6px;letter-spacing:0}
.entry .entry-subtitle{font-size:14px;color:var(--text-2);margin:0 0 18px}
.entry label{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin:0 0 6px}
.entry input{display:block;width:100%;padding:.75em .85em;font-size:16px;background:var(--ground);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;margin-bottom:16px}
.entry input:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.entry input[readonly]{cursor:default}.entry .primary{width:100%;padding:.85em 1.6em;font-size:16px;margin:0}
.entry-note{font-size:13px;color:var(--text-3);margin:14px 0 0;line-height:1.45}
.status-note{font-size:13px;color:var(--text-3);margin:14px 0 0;line-height:1.5}
.error{color:var(--bad);font-size:14px;margin:10px 0 0}.error:empty{display:none}
.outline{padding-top:26px;margin-top:34px;border-top:1px solid var(--line)}
.outline h3{font-family:var(--f-display);font-size:23px;margin-bottom:16px}
.outline ol{columns:2;column-gap:60px;padding-left:22px;margin-bottom:0}
.outline li{padding:7px 8px;break-inside:avoid;font-size:14.5px}.outline li::marker{color:var(--accent);font-family:var(--f-mono);font-size:12px}

/* Centered slide player and segmented progress rail. */
.topbar{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1240px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.brand-logo{height:34px;width:34px;object-fit:contain;border-radius:50%;background:#fff;flex:none}
.brand-name{font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.3}.brand-sub{font-size:11px;color:var(--text-3);margin-top:2px}
.topmeta{display:flex;align-items:center;gap:14px}.who{font-size:13px;color:var(--text-3);max-width:22ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.counter{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-2);white-space:nowrap}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.top-actions button{font-size:12px;padding:6px 9px}
.rail{display:flex;gap:2px;width:100%;padding:0 20px 9px;max-width:1240px;margin:0 auto}
.seg{flex:1;height:5px;border-radius:2px;background:var(--line);position:relative;transition:background .2s}
.seg.done{background:var(--accent)}.seg.cur{background:var(--text)}
.seg.gate::after{content:"";position:absolute;left:50%;top:-4px;width:3px;height:3px;margin-left:-1.5px;border-radius:50%;background:var(--warn)}
.main{max-width:1180px;width:100%;padding:18px 20px 40px;margin:0 auto;min-width:0}
.course-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px}
.overall-label{font-size:12px;color:var(--text-3);margin:0}.menu-toggle{font-size:12px;padding:6px 10px}
.section-list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;list-style:none;padding:14px;margin:0 0 18px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.section-list button{width:100%;text-align:left;border:0;display:grid;grid-template-columns:22px 1fr;gap:7px;padding:10px 8px;font-size:13px;line-height:1.35;font-weight:500;background:none}
.section-list button.current{background:var(--accent-soft);box-shadow:inset 3px 0 var(--accent);font-weight:700}
.section-list .number{color:var(--accent);font-family:var(--f-mono);font-size:12px;font-weight:600}
.lesson-top{display:flex;justify-content:space-between;gap:20px;margin-bottom:9px}.lesson-top .counter{font-size:11px;color:var(--text-3)}
.lesson-content{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:clamp(24px,3.6vw,44px);min-height:430px}
.lesson-columns{display:grid;gap:clamp(20px,3vw,38px);grid-template-columns:minmax(0,1fr) minmax(250px,.85fr);align-items:start}
.points{padding:0;margin:0;list-style:none;display:grid;gap:12px;color:var(--text-2)}
.points li{padding-left:20px;position:relative;font-size:16.5px;line-height:1.6}
.points li:before{content:"";position:absolute;width:5px;height:5px;left:0;top:.65em;border-radius:50%;background:var(--accent)}
.form-figure{margin:0;background:var(--ground);border:1px solid var(--line);padding:12px;border-radius:9px;text-align:center}
.form-figure img{max-width:100%;width:100%;height:340px;object-fit:contain;display:block;background:#fff}
.form-figure button{margin-top:10px;font-size:13px}.form-figure figcaption{font-size:12px;color:var(--text-3);margin-top:8px}
.sources-line{margin-top:24px;font-size:12px;color:var(--text-3)}.case-note{border-left:3px solid var(--warn);padding:12px 15px;margin:22px 0 0;font-size:13px;background:var(--warn-soft);color:var(--text-2);border-radius:6px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;padding-top:14px}
.player{min-width:0}.audio-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.audio-row button{font-size:13px}
.player-note{font-size:12px;color:var(--text-3);min-height:19px;margin:8px 0 0}
.voice-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:9px;align-items:center}
.voice-row label{font-size:12px;display:flex;gap:6px;align-items:center;color:var(--text-2)}
.voice-row select{max-width:230px;background:var(--surface);color:var(--text);border:1px solid var(--line-strong);border-radius:8px;font-size:12px;padding:7px;cursor:pointer}
.voice-row .auto-label{font-size:11px;color:var(--text-3)}.voice-row input{accent-color:var(--accent)}
.narration-track{height:4px;background:var(--line);flex:1;min-width:70px;max-width:140px;border-radius:4px;overflow:hidden}
.narration-track span{display:block;height:100%;width:0;background:var(--accent)}
.nav-row{display:flex;justify-content:flex-end;align-items:center;gap:10px;flex-wrap:wrap;max-width:310px}
.nav-message{font-size:11px;color:var(--text-3);text-align:right;order:3;flex-basis:100%;max-width:310px}
.transcript{margin-top:16px;border:1px solid var(--line);padding:18px 20px;border-radius:10px;background:var(--surface)}
.transcript summary{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);cursor:pointer}
.transcript p{font-size:16px;line-height:1.7;margin:16px 0 3px;white-space:pre-line;max-width:74ch;color:var(--text-2)}
.question-prompt{font-size:22px;line-height:1.45;margin-bottom:23px;max-width:850px}
.options{display:grid;gap:9px}.option{display:flex;align-items:start;gap:12px;text-align:left;width:100%;font-weight:400;padding:13px 15px;line-height:1.45;background:var(--ground)}
.option .letter{border:1px solid var(--line-strong);width:23px;min-width:23px;height:23px;border-radius:5px;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;font-weight:600;color:var(--text-3);margin-top:1px}
.option.selected{background:var(--accent-soft);border:2px solid var(--accent);padding:12px 14px}.option.correct{background:var(--good-soft);border-color:var(--good)}.option.correct .letter{color:var(--good);border-color:var(--good)}.option.wrong{background:var(--bad-soft);border-color:var(--bad)}
.feedback{padding:15px 17px;border-left:3px solid var(--good);border-radius:8px;background:var(--good-soft);margin-top:18px;font-size:14.5px;color:var(--text-2)}.feedback strong{color:var(--text)}.feedback.retry{border-color:var(--warn);background:var(--warn-soft)}
.comparison{width:100%;border-collapse:collapse;margin-top:20px;font-size:14.5px;color:var(--text-2)}.comparison th,.comparison td{padding:12px 10px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}.comparison th{background:var(--ground);font-size:13px;color:var(--text)}.table-wrap{overflow-x:auto}
.exam-meta{display:flex;justify-content:space-between;gap:15px;color:var(--text-3);font-family:var(--f-mono);font-size:12px;margin-bottom:23px}.exam-footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:25px}.exam-summary{display:flex;gap:5px;flex-wrap:wrap;margin:20px 0}.exam-dot{width:32px;height:32px;border-radius:5px;font-family:var(--f-mono);font-size:12px;padding:0}.exam-dot.answered{background:var(--good-soft);border-color:var(--good)}.exam-dot.active{outline:2px solid var(--accent);outline-offset:2px}
.score{font-size:68px;line-height:1;color:var(--accent);font-family:var(--f-display);margin:15px 0}.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}.review-item{border-top:1px solid var(--line);padding:18px 0}.review-item p{font-size:15px;margin:8px 0}.review-item strong{font-size:16px}.ack{display:grid;gap:12px;margin:24px 0}.ack label{display:flex;gap:12px;align-items:start;font-size:16px}.ack input{width:19px;height:19px;margin-top:3px;accent-color:var(--accent)}
/* Source forms and printable certificates keep their paper appearance. */
.certificate{color-scheme:light;color:#16211F;border:1px solid #8a9d90;outline:5px solid #eff2e8;outline-offset:6px;padding:42px 40px;text-align:center;max-width:900px;margin:20px auto 30px;background:#fff}
.certificate .brand-logo{height:90px;width:90px}.certificate .cert-title{font-family:var(--f-display);font-size:37px;margin:25px 0 15px}.certificate .cert-name{font-family:var(--f-display);font-size:33px;padding:10px 0;margin:20px 0;border-bottom:1px solid #c3cfbf;overflow-wrap:anywhere}.cert-details{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:25px 0}.cert-details small{display:block;color:#4E5B58}.certificate .cert-footer{font-size:12px;color:#4E5B58;margin:25px 0 0}
dialog{border:1px solid var(--line);border-radius:14px;color:var(--text);padding:0;max-width:min(1050px,94vw);width:94vw;max-height:91vh;background:var(--surface);box-shadow:0 24px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(8,15,14,.72);backdrop-filter:blur(3px)}.dialog-header{display:flex;align-items:center;gap:15px;justify-content:space-between;padding:19px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}.dialog-header h2{font-size:24px;margin:0}.dialog-body{padding:25px;overflow:auto}.dialog-body img.full-form{display:block;width:100%;height:auto;max-width:none;background:#fff}.resource-list{display:grid;gap:0}.resource-row{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:17px 0;border-bottom:1px solid var(--line)}.resource-row strong{display:block;font-size:17px}.resource-row p{font-size:13px;color:var(--text-2);margin:5px 0 0}.source-entry{padding:15px 0;border-bottom:1px solid var(--line)}.source-entry p{font-size:14px;margin:6px 0}.resource-tabs{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap}.storage-warning{padding:12px 17px;background:var(--warn-soft);color:var(--warn);font-size:13px;border-bottom:1px solid var(--warn)}.site-footer{font-size:12px;color:var(--text-3);text-align:center;margin:28px 0 0}.instructor-copy{font-size:16px;max-width:830px}.instructor-copy li{margin:9px 0}.instructor-copy code{font-family:var(--f-mono);font-size:14px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}.progress-label{font-size:12px;color:var(--text-3)}
@media(max-width:860px){.intro{grid-template-columns:1fr}.outline ol{columns:1}.lesson-columns{grid-template-columns:1fr}.form-figure{max-width:600px}.controls{grid-template-columns:1fr}.nav-row{max-width:none;justify-content:space-between}.nav-message{order:0;flex:1;text-align:center}.section-list{grid-template-columns:repeat(2,minmax(0,1fr))}.who{display:none}}
@media(max-width:600px){.topbar-in{padding:10px 12px;gap:10px}.brand-sub{display:none}.brand-name{font-size:12px}.brand-logo{width:27px;height:27px}.topmeta{margin-left:auto}.top-actions{width:100%;justify-content:flex-end}.rail{padding-left:12px;padding-right:12px}.main{padding:14px 12px 30px}.welcome{padding:30px 20px 36px}.entry{padding:24px 20px}.fact{grid-template-columns:90px 1fr;gap:12px}.lesson-content{padding:20px 18px;min-height:350px}.lesson-top{gap:10px}.lesson-top .kicker{font-size:10px}.points li{font-size:16px}.question-prompt{font-size:20px}.voice-row{gap:10px}.voice-row select{max-width:190px}.nav-row{flex-wrap:wrap}.nav-message{order:3;flex-basis:100%}.nav-row>button:last-child{margin-left:auto}.section-list{grid-template-columns:1fr}.certificate{padding:26px 18px;margin:15px 8px 25px}.certificate .cert-title{font-size:29px}.certificate .cert-name{font-size:28px}.cert-details{grid-template-columns:1fr}.resource-row{align-items:start;flex-direction:column;gap:10px}.dialog-header{padding:15px}.dialog-body{padding:18px}.comparison{min-width:490px}.exam-footer{flex-wrap:wrap}.course-tools{gap:8px}.overall-label{font-size:11px}}
@media print{body{color-scheme:light;background:#fff;color:#16211F;font-size:12pt}.topbar,.course-tools,.section-list,.lesson-top,.player,.controls,.transcript,.nav-row,.site-footer,.result-actions,.top-actions,.storage-warning,.sources-line,.skip,dialog,.screen-only{display:none!important}.main{padding:0;max-width:none}.lesson-content{padding:0;border:0;box-shadow:none;background:#fff;color:#16211F}.certificate{outline:none;page-break-inside:avoid;margin:15mm 4mm;padding:12mm 10mm;max-width:none;border:2px solid #294c42}.certificate .cert-name{font-size:29pt}.certificate .cert-title{font-size:28pt}.cert-details{grid-template-columns:repeat(3,1fr)}.certificate .brand-logo{height:70px;width:70px}.certificate p{margin-bottom:12px}.print-hide{display:none!important}@page{size:letter portrait;margin:12mm}}
</style>

HCBS settings guidance","url":"https://www.medicaid.gov/sites/default/files/2019-12/hcbs-systemic-and-site-specific.pdf","detail":"Respect for dignity, autonomy, and participant-directed choices. Overnight staff expectations address supervision and staff personal errands, not a blanket restriction on participant choice."},"abuse":{"title":"Provided AG training: recipient abuse and Medicaid fraud","detail":"HCBSPreventionProsecutionRecipientAbuseMedicaidFraud.ppt. Used for DSW conduct and prevention principles. Historical statistics and outdated penalty summaries are not repeated."},"docdeck":{"title":"Provided DSW documentation training","detail":"DOCUMENTATIONOFSERVICESDSW.ppt, 23 slides. Person-centered documentation, facts, service plans, corrections, and medical-visit communication."},"oaas":{"title":"OAAS service-log instructions supplied by the agency","detail":"CCWServiceLogAndInstructions.pdf and LT-PCSServiceLogAndInstructions.pdf. OAAS-P-18-005, reissued August 10, 2021. Both uploaded instruction files contain the same four-page instructions for CCW PAS and LT-PCS.","url":"https://ldh.la.gov/assets/docs/oaas/publications/servicelogs/ccwservicelogandinstructions.pdf"},"ccw":{"title":"Agency CCW PAS log","detail":"CCW Timesheet-2026.pdf. OAAS-PF-11-015. Actual agency form shown in this course.","resource":"ccw"},"ltpcs":{"title":"Agency LT-PCS log","detail":"LTPCS Log-2026.pdf. OAAS-PF-10-010. Actual agency form shown in this course.","resource":"ltpcs"},"ocdd":{"title":"OCDD provider documentation training used in prior agency work","detail":"ProviderDocumentationRequirementsTraining013125.pdf, 51 pages, January 22, 2025. This course teaches the agency single-shift form only.","resource":"ocdd_guidance"},"ocddform":{"title":"Agency OIDD single-shift progress note and additional page","detail":"OIDD Waiver Daily Service Log/Progress Note. OCDD-PF-25-002 single-shift form and OCDD-PF-25-004 additional-notes page, both revised July 10, 2026.","resource":"ocddform"},"ocddprior":{"title":"Previous agency progress-note course","detail":"This module reinforces the single-shift documentation practices taught in the prior agency course.","url":"https://hoenmamou.github.io/progressnote_training/"},"daily":{"title":"Agency daily EVV attestation","detail":"Daily Attestation Form for EVV Manual Entry.docx. Actual agency form, with required reason and DSW attestation.","resource":"daily"},"weekly":{"title":"Agency weekly EVV attestation","detail":"Attestation Form for EVV Manual Entry.docx. The supplied form contains separate Week 1 and Week 2 grids.","resource":"weekly"},"agunit":{"title":"Louisiana AG Medicaid Fraud Control Unit","url":"https://www.aglizmurrill.com/Division/MedicaidFraud","detail":"Definition of Medicaid fraud and MFCU reporting contacts, checked November 3, 2026."},"paul":{"title":"AG DSW case: overlapping employment","url":"https://www.aglizmurrill.com/Article/524","detail":"Nedria Paul arrest announcement. Arrest reported May 18, 2026. Allegations in the announcement are not a finding of guilt."},"molden":{"title":"AG DSW case: records conflict with travel","url":"https://www.aglizmurrill.com/Article/633","detail":"Sharon Molden arrest announcement, September 2026. Allegations in the announcement are not a finding of guilt."},"cordoba":{"title":"AG DSW case: recipient unavailable for claimed care","url":"https://www.aglizmurrill.com/Article/607","detail":"Mauricio Cordoba arrest announcement. Arrest reported August 24, 2026. Allegations in the announcement are not a finding of guilt."},"cephus":{"title":"AG caretaker case: daily logs for care allegedly not provided","url":"https://www.aglizmurrill.com/Article/474","detail":"Mylanta Denise Cephus arrest announcement. Arrest reported March 31, 2026. Allegations in the announcement are not a finding of guilt."},"law":{"title":"Louisiana Revised Statutes 14:70.1","url":"https://legis.la.gov/legis/Law.aspx?d=78639","detail":"Medicaid fraud definition and statutory criminal penalty. Checked November 3, 2026."},"report":{"title":"LDH reporting contacts for abuse and exploitation","url":"https://ldh.la.gov/page/critical-incident-reporting","detail":"Age-specific protective-services contacts and local law-enforcement reporting. Checked November 3, 2026."},"elder":{"title":"Provided AG Elder Fraud Prevention guide","detail":"ElderFraud.pdf, 28 PDF pages. Warning signs, eight scam categories, prevention, and reporting. Page citations in lessons refer to PDF pages.","resource":"elder"},"consumer":{"title":"Louisiana AG Consumer Protection contacts","url":"https://www.ag.louisiana.gov/ConsumerDispute","detail":"Consumer Protection Hotline 1-800-351-4889. Consumer disputes and criminal-reporting distinction. Checked November 3, 2026."},"ftc":{"title":"FTC: What to do if you were scammed","url":"https://consumer.ftc.gov/articles/what-do-if-you-were-scammed","detail":"Contact the payment company promptly, secure compromised accounts, and report scams. Checked November 3, 2026."},"ic3":{"title":"FBI Internet Crime Complaint Center","url":"https://www.ic3.gov/","detail":"Internet-enabled crime reporting and warning about recovery impostors. Checked November 3, 2026."},"ftcreport":{"title":"FTC scam reporting","url":"https://reportfraud.ftc.gov/","detail":"Report scams and deceptive practices."},"identity":{"title":"FTC identity-theft recovery","url":"https://www.identitytheft.gov/","detail":"Identity-theft report and recovery steps."}},"slides":[{"section":"start","title":"Your work. Your records. Their safety.","points":["Protect the person receiving services.","Record the care and time you actually provided.","Recognize scams at work and at home."],"narration":"Your work. Your records. Their safety.. Welcome to Heaven-On-Earth Network of Mamou. This training is for DSWs. Your work affects a person's safety, dignity, and independence. Your records also support the services the agency bills to Medicaid. We will connect those responsibilities using the actual forms you work with. We will begin with agency housekeeping and professional conduct. You will then review participant protection, home-care Medicaid fraud, clear documentation, OAAS paperwork, OCDD progress notes, and EVV backup forms. An additional module will help you recognize elder fraud affecting participants, your own family, or you.","kind":"lesson","sources":["abuse","docdeck","elder"],"id":"lesson-01"},{"section":"start","title":"How to complete this course","points":["Use sound and listen to every lesson.","Answer each practice question correctly to continue.","Pass the 29-question final test with at least 24 correct answers.","Save or print your completion certificate for the office."],"narration":"How to complete this course. Choose an available English narration voice and a comfortable speed, then listen to each lesson. The Next button becomes available when the narration finishes. You can pause or replay a lesson. Practice questions allow another try and give an explanation. The final test has twenty-nine questions. You need at least twenty-four correct answers to pass. You may review the lessons and retake the test. Your progress saves in this browser when browser storage is available. At completion, save or print your certificate and follow the office's instructions for submitting it.","kind":"lesson","id":"lesson-02"},{"section":"housekeeping","title":"Dress for the work","points":["Wear clean medical scrubs while working with a participant or in the home.","Keep your agency ID visible above the waist or in the chest area.","Wear closed-toe shoes suitable for the work.","Use only the coordinated clothing combinations allowed by the handbook."],"narration":"Dress for the work. Arrive ready to work in the agency's required attire. Medical scrubs are the standard uniform when working with a participant or in the participant's home. Your identification badge must remain visible above the waist or in the chest area on a retractable clip. Wear closed-toe shoes. The handbook also permits appropriate-length dresses, skirts, capri pants, or culottes when worn with a coordinated scrub jacket. That exception does not make prohibited clothing acceptable. Ask the office before wearing an outfit if you are unsure whether it meets the policy.","kind":"lesson","sources":["handbook"],"id":"lesson-03"},{"section":"housekeeping","title":"Clothing that does not meet the policy","points":["No sweatpants, spandex, leggings, bike-style pants, or wind suits.","No short shorts, miniskirts, tank tops, spaghetti straps, or midriff tops.","No spaghetti-strap or lace sundresses.","No flip-flops, sandals, slides, or other open-toed footwear."],"narration":"Clothing that does not meet the policy. The dress code applies throughout the shift, including evening and overnight work. The handbook identifies sweatpants, spandex, leggings, bike-style pants, and wind suits as inappropriate. It also excludes short shorts, miniskirts, tank tops, spaghetti straps, cropped or midriff tops, and the listed sundress styles. Wear closed-toe shoes rather than flip-flops, sandals, or slides. The participant's home is your workplace during the shift. Dress in a way that supports safe care, appropriate movement, and the dignity of everyone in the home.","kind":"lesson","sources":["handbook","agency_reminders"],"id":"lesson-04"},{"section":"housekeeping","title":"Shift changes require office approval","points":["Work the schedule assigned by the office.","Request a swap, coverage change, or added shift through the office or supervisor.","Wait for approval before changing the arrangement.","A staff member or family member’s agreement does not replace approval."],"narration":"Shift changes require office approval. You do not schedule your own shifts or independently swap assignments. Contact the office or your supervisor before changing a shift, arranging coverage, or accepting a different assignment. Explain the request and wait for approval. A private agreement between two staff members is not an approved schedule change. A participant or family member also cannot replace the office's scheduling process. If an urgent problem occurs, use the supervisor or on-call process. Make sure the office knows who is actually providing care and when.","kind":"lesson","sources":["handbook","agency_reminders"],"id":"lesson-05"},{"section":"housekeeping","title":"Practice: a private shift swap","points":[],"narration":"Practice: a private shift swap. You and another DSW agree to swap Saturday shifts. What must happen before either of you works the changed schedule? Option 1. Notify the participant after the swap is complete. Option 2. Contact the office or supervisor and receive approval. Option 3. Keep the agreement between the two staff members. Option 4. Ask a family member to approve the swap instead. Choose your answer on the screen.","kind":"check","question":{"prompt":"You and another DSW agree to swap Saturday shifts. What must happen before either of you works the changed schedule?","options":["Notify the participant after the swap is complete","Contact the office or supervisor and receive approval","Keep the agreement between the two staff members","Ask a family member to approve the swap instead"],"answer":1,"explanation":"A private agreement is not an approved schedule. The office or supervisor must review and approve the change."},"sources":["handbook","agency_reminders"],"id":"lesson-06"},{"section":"housekeeping","title":"Responding when a participant is upset","points":["Keep your voice calm and your language respectful.","Give space when safe and use clear, simple communication.","Follow the person’s behavior, care, and safety plans.","Seek help early when the situation is escalating."],"narration":"Responding when a participant is upset. A participant's distress does not give staff permission to yell back, insult, threaten, or argue. Keep your tone calm. Give the person space when it is safe, reduce unnecessary demands, and use clear language. You might say: I can see you are upset. Let us take a moment. Follow the person's individual support and safety plans and the methods you have been trained to use. Do not improvise punishment or physical control. Contact the supervisor for help and use emergency services when there is immediate danger. Document what occurred and your response factually.","kind":"lesson","sources":["handbook","abuse","agency_reminders"],"id":"lesson-07"},{"section":"housekeeping","title":"Responding to family members","points":["Listen without arguing and acknowledge the concern.","Explain your role respectfully and protect confidential information.","Refer care-plan, scheduling, and unresolved concerns to the office.","Avoid promises or changes you are not authorized to make."],"narration":"Responding to family members. Treat family members with the same professionalism you expect from others. Listen and acknowledge the concern without arguing in the home. You can say: I hear your concern. Let me contact the supervisor so we can handle this correctly. Share information only with people authorized to receive it. Follow the participant's plan and the role of any authorized representative. If someone requests a change in care or staffing, bring it to the office. Do not criticize another employee, discuss private staff matters, or make promises outside your authority.","kind":"lesson","sources":["handbook","agency_reminders"],"id":"lesson-08"},{"section":"housekeeping","title":"Respect between staff members in the home","points":["Speak calmly. Yelling at another DSW is unacceptable.","Keep arguments, insults, and staff complaints out of the participant’s care space.","Use the care plan and the authorized chain of command.","Share useful care information and report disagreements to the supervisor."],"narration":"Respect between staff members in the home. We speak to one another with respect. Yelling at another DSW in a participant's home is unacceptable. The person receiving services should feel safe in their own home. Do not give a staff member your own care orders, change the person's plan, or act as that staff member's supervisor. Care instructions come from the authorized plan and appropriate supervisory or clinical direction. A respectful handoff is still necessary. Share changes and safety information, and speak up if immediate harm is possible. Bring disagreements to the supervisor instead of arguing or trying to control another staff member.","kind":"lesson","sources":["handbook","agency_reminders"],"id":"lesson-09"},{"section":"housekeeping","title":"Tasks, handoff, and the end of a shift","points":["Complete your assigned participant-care tasks during your shift.","Report unfinished tasks and important care information before leaving.","Do not order a staff member to stay or return after their shift to finish chores.","The supervisor handles unresolved work and coverage. Record all time actually worked."],"narration":"Tasks, handoff, and the end of a shift. Plan your shift so assigned tasks are completed. That includes finishing the participant's laundry or dishes when those tasks are assigned. If something remains incomplete, explain the facts during handoff and notify the supervisor. Do not yell at a staff member, order them to stay after their shift, or tell them to return for a chore. Staff do not assign one another extra work hours. The supervisor decides how an unresolved task or coverage problem will be handled. Required work must be recorded accurately; do not work or ask someone else to work off the clock.","kind":"lesson","sources":["handbook","agency_reminders","hours_worked"],"id":"lesson-10"},{"section":"housekeeping","title":"Practice: unfinished laundry at handoff","points":[],"narration":"Practice: unfinished laundry at handoff. Another DSW’s shift has ended and the participant’s laundry is not folded. What is the appropriate response? Option 1. Yell at the DSW and demand that they stay until it is folded. Option 2. Tell the participant to settle the disagreement. Option 3. Discuss the unfinished task calmly and notify the supervisor to resolve it. Option 4. Tell the DSW to return later and finish it off the clock. Choose your answer on the screen.","kind":"check","question":{"prompt":"Another DSW’s shift has ended and the participant’s laundry is not folded. What is the appropriate response?","options":["Yell at the DSW and demand that they stay until it is folded","Tell the participant to settle the disagreement","Discuss the unfinished task calmly and notify the supervisor to resolve it","Tell the DSW to return later and finish it off the clock"],"answer":2,"explanation":"Communicate respectfully and use the supervisor. Peers do not assign extra hours or require off-the-clock work. This does not remove any need for required participant coverage."},"sources":["handbook","agency_reminders","hours_worked"],"id":"lesson-11"},{"section":"housekeeping","title":"Overnight supervision and personal errands","points":["Do not take a participant out at night to handle your own errands.","Once the participant is settled in bed, remain in the home and provide required supervision.","Leave with the participant at that point only for an emergency, following the emergency plan.","Never leave a participant without the supervision or coverage their plan requires."],"narration":"Overnight supervision and personal errands. Your overnight shift is for the participant's care. Do not take the participant out to shop for yourself, visit someone, get something you want, or handle other personal business. Once the participant is settled in bed, especially during twenty-four-hour care, remain in the home and provide the required supervision. Leaving with the participant at that point is for an emergency, following the emergency plan and notifying emergency services and the office as appropriate. Do not wake someone or disrupt their rest for your convenience. Support the person's own choices through their individual plan; personal errands must never dictate their routine.","kind":"lesson","sources":["agency_reminders","handbook","hcbs_choices"],"id":"lesson-12"},{"section":"housekeeping","title":"Practice: an overnight personal errand","points":[],"narration":"Practice: an overnight personal errand. A participant receiving 24-hour care is asleep in bed. You want to drive to a store for something for yourself. What should you do? Option 1. Wake the participant and take them along. Option 2. Leave them asleep and make the trip quickly. Option 3. Ask a neighbor to listen for them while you go. Option 4. Remain in the home and provide the required supervision. Do not make the personal trip.. Choose your answer on the screen.","kind":"check","question":{"prompt":"A participant receiving 24-hour care is asleep in bed. You want to drive to a store for something for yourself. What should you do?","options":["Wake the participant and take them along","Leave them asleep and make the trip quickly","Ask a neighbor to listen for them while you go","Remain in the home and provide the required supervision. Do not make the personal trip."],"answer":3,"explanation":"Personal errands are not a reason to take the participant out or leave them without required coverage. Once settled in bed, an overnight departure with the participant is for an emergency under the emergency plan."},"sources":["agency_reminders","handbook"],"id":"lesson-13"},{"section":"housekeeping","title":"A professional handoff protects everyone","points":["Give a calm update about care, changes, and unfinished responsibilities.","Keep the participant out of staff disagreements.","If relief is missing, contact the supervisor and maintain required coverage.","Use the office or on-call number: 337-468-2730."],"narration":"A professional handoff protects everyone. A handoff is a short exchange of useful information, not an opportunity to criticize or give personal orders. Explain what happened during the shift, any change in the participant's condition, and any task that needs supervisor follow-up. Keep the participant out of a staffing disagreement. If relief has not arrived and continued supervision is required, contact the supervisor and maintain coverage under the agency's instructions. A late relief DSW is different from a peer demanding that someone stay to finish chores. Record the actual service time and report the problem through the office or on-call number.","kind":"lesson","sources":["handbook","agency_reminders"],"id":"lesson-14"},{"section":"protect","title":"Dignity and choice during every shift","points":["Explain what you are doing and ask before providing care.","Respect privacy and the person’s choices.","Follow the plan of care and your training.","Ask the office for help when care becomes difficult."],"narration":"Dignity and choice during every shift. A person's home remains their home while you are working. Explain the task and ask before helping with bathing, dressing, meals, or another personal activity. Keep the person covered and protect private conversations. Follow the current plan of care and work only within your training and assigned duties. If the person declines an activity, use the care plan and notify the appropriate supervisor when needed. Frustration does not excuse threats or rough treatment. Get help before a difficult situation becomes unsafe.","kind":"lesson","sources":["abuse","docdeck"],"id":"lesson-15"},{"section":"protect","title":"What abuse can look like","points":["Physical: hitting, rough handling, or causing pain.","Emotional or verbal: threats, humiliation, or intimidation.","Sexual: unwanted sexual contact or conduct.","Financial: misuse of money, property, or identity."],"narration":"What abuse can look like. Abuse can happen through actions, words, or misuse of someone's resources. Hitting or handling a person roughly can cause injury. Threatening to leave someone alone, making fun of their disability, or yelling to frighten them can cause emotional harm. Sexual contact without valid consent is a serious concern. Taking money, using a person's debit card for yourself, or obtaining information through deception can be financial exploitation. A person does not need a visible bruise for you to recognize and report a concern.","kind":"lesson","sources":["abuse"],"id":"lesson-16"},{"section":"protect","title":"Neglect and unsafe abandonment","points":["Provide the supervision and supports required by the care plan.","Do not leave a person without required coverage.","Report unmet needs and unsafe conditions promptly.","Arrange help through the office when you cannot continue safely."],"narration":"Neglect and unsafe abandonment. Neglect includes failing to provide required care or protection. Examples can include leaving someone without the supervision their plan requires, ignoring a serious change in condition, or failing to provide needed assistance with food, hygiene, or mobility. Do not walk off a shift when the person needs continued coverage. Contact the office for relief and follow emergency instructions. If you become ill or a replacement does not arrive, report the problem immediately. An unsafe staffing situation needs action and honest documentation.","kind":"lesson","sources":["abuse"],"id":"lesson-17"},{"section":"protect","title":"Practice: the relief DSW is late","points":[],"narration":"Practice: the relief DSW is late. Your shift ends at 6 p.m. The participant requires continuous supervision and the relief DSW has not arrived. What should you do? Option 1. Leave at 6 p.m. and text the other staff member later. Option 2. Contact the office immediately and follow its coverage and safety instructions. Option 3. Ask the participant to clock the next staff member in. Option 4. Write that the next staff member arrived on time. Choose your answer on the screen.","kind":"check","question":{"prompt":"Your shift ends at 6 p.m. The participant requires continuous supervision and the relief DSW has not arrived. What should you do?","options":["Leave at 6 p.m. and text the other staff member later","Contact the office immediately and follow its coverage and safety instructions","Ask the participant to clock the next staff member in","Write that the next staff member arrived on time"],"answer":1,"explanation":"The participant’s safety comes first. Report the missing coverage immediately, follow the office’s instructions, and record what actually happened. Never create a false visit entry."},"sources":["abuse"],"id":"lesson-18"},{"section":"protect","title":"Money, property, and personal boundaries","points":["Use funds only for the person’s authorized needs.","Keep receipts and follow the agency’s money-handling procedure.","Never borrow money or use someone’s card for your purchases.","Protect financial information and personal belongings."],"narration":"Money, property, and personal boundaries. Small amounts of money and inexpensive belongings still belong to the participant. A sentimental item may matter far more than its sale value. When your assigned duties include shopping, handle the money as instructed, keep receipts, and return the change. Do not borrow cash, buy your own groceries with the person's card, or use their accounts. Do not accept control of finances simply because it seems convenient. Questions about gifts, loans, account access, or spending should go to the office.","kind":"lesson","sources":["abuse"],"id":"lesson-19"},{"section":"protect","title":"Changes worth noticing","points":["New bruises, pain, fear, withdrawal, or unusual distress.","Missing money, belongings, medication, or needed supplies.","Sudden changes in who controls calls, visits, or finances.","Record observations without deciding who is guilty."],"narration":"Changes worth noticing. Pay attention to changes from what is usual for the person. New bruises, fear of a particular person, unusual distress, missing belongings, or a sudden lack of food can signal a problem. These observations do not establish a cause by themselves. Record exactly what you see, what the person says, and when it occurred. Avoid guessing or questioning the person repeatedly. Share the concern through the required reporting process so the appropriate people can assess it.","kind":"lesson","sources":["abuse","docdeck"],"id":"lesson-20"},{"section":"protect","title":"Responding to a safety concern","points":["Call 911 for immediate danger or a medical emergency.","Notify the office promptly and make required outside reports.","Preserve evidence and document facts.","Never threaten, retaliate, or pressure someone to stay silent."],"narration":"Responding to a safety concern. First address immediate danger. Call nine one one when someone needs emergency help. Notify the office promptly and follow the required protective-services, law-enforcement, and program reporting process. Telling the office does not replace an outside report that you are required to make. Do not wait for proof or finish a long note before seeking help. Preserve relevant records. Do not alter documents, intimidate a witness, promise secrecy, or confront a suspected abuser in a way that increases danger.","kind":"lesson","sources":["abuse","report"],"id":"lesson-21"},{"section":"protect","title":"Where to report suspected abuse","points":["Immediate danger: 911.","Children under 18: 1-855-452-5437 and local law enforcement.","Adults 18–59: APS at 1-800-898-4910 and local law enforcement.","Adults 60 and older: EPS at 1-833-577-6532 and local law enforcement.","Agency office: 337-468-2730. Follow program incident-reporting procedures."],"narration":"Where to report suspected abuse. Use the reporting route for the person's age and situation. Louisiana lists child protection at one eight five five, four five two, five four three seven. Adult Protective Services for adults eighteen through fifty-nine is one eight hundred, eight nine eight, four nine one zero. Elderly Protective Services for adults sixty and older is one eight three three, five seven seven, six five three two. Local law enforcement is also part of the reporting route shown by LDH. Notify the agency office and follow the applicable incident-reporting procedure.","kind":"lesson","sources":["report"],"id":"lesson-22"},{"section":"protect","title":"Practice: a disclosure","points":[],"narration":"Practice: a disclosure. A participant says a caregiver took money and asked them not to tell anyone. What is the best response? Option 1. Promise that you will keep it secret. Option 2. Demand a confession from the caregiver. Option 3. Listen calmly, protect immediate safety, document the statement, and follow reporting requirements. Option 4. Wait until you personally prove the theft. Choose your answer on the screen.","kind":"check","question":{"prompt":"A participant says a caregiver took money and asked them not to tell anyone. What is the best response?","options":["Promise that you will keep it secret","Demand a confession from the caregiver","Listen calmly, protect immediate safety, document the statement, and follow reporting requirements","Wait until you personally prove the theft"],"answer":2,"explanation":"Listen respectfully and report the concern through the required process. Record the person’s words and what you observed. Do not promise secrecy, investigate on your own, or delay until you have proof."},"sources":["abuse","docdeck","report"],"id":"lesson-23"},{"section":"fraud","title":"Accurate time is part of honest care","points":["Clock in and out for yourself.","Record actual service time and location.","Document only the services you personally provided.","A participant’s agreement cannot make a false entry acceptable."],"narration":"Accurate time is part of honest care. Your visit record tells the agency when and where you actually delivered services. Clock in and out for yourself using the approved process. Do not let another staff member, a participant, or a family member make your electronic visit entries for you. Enter the real beginning and end of care. A participant cannot give permission for you to claim time you did not work. The same responsibility applies when your services involve a relative or someone you know well.","kind":"lesson","sources":["abuse","ocdd"],"id":"lesson-24"},{"section":"fraud","title":"An error and intentional fraud","points":["Report an honest error promptly for a supported correction.","Knowingly submitting false information can be Medicaid fraud.","Never hide an error by creating another false record."],"narration":"An error and intentional fraud. An honest recording mistake needs prompt attention and a truthful correction. Intentional false information is a different matter. The Louisiana Attorney General describes Medicaid fraud as intentionally submitting a false claim. A DSW's service log or time entry can become support for that claim even when the office submits the bill. If you discover the wrong time, wrong participant, or a missed clock-out, tell the office what happened. Keep the original information available and follow the correction process.","kind":"lesson","sources":["abuse","agunit","law"],"id":"lesson-25"},{"section":"fraud","title":"Time that cannot truthfully be claimed","points":["Leaving the participant while remaining clocked in.","Working a different job during the same claimed care time.","Recording visits that never happened.","Signing another staff member’s name or covering up a missed shift."],"narration":"Time that cannot truthfully be claimed. A schedule does not prove that care happened. Do not stay clocked in after leaving to work another job or attend to personal business. Do not claim a visit that another person performed. Do not add hours because a participant has unused authorized time or because someone says the office needs the paperwork. School, hospital, and other provider records may show that a claimed visit could not have occurred. Report service interruptions so the office can determine the correct action under the person's authorization.","kind":"lesson","sources":["abuse","ocdd"],"id":"lesson-26"},{"section":"fraud","title":"AG example: a second job during care hours","points":["The AG reported a DSW arrest in May 2026.","The allegation involved Medicaid care time overlapping another job.","Lesson: end and document care time honestly when services stop."],"narration":"AG example: a second job during care hours. The Attorney General announced the May eighteenth, twenty twenty-six arrest of DSW Nedria Paul. The announcement describes alleged time entries for care while the staff member was also working another job, including leaving the recipient while remaining clocked in. Employment records were part of the investigation. This is an arrest announcement, not a conviction report. Paul is presumed innocent. For DSW practice, a visit record must describe the care that actually occurred.","kind":"lesson","sources":["paul"],"case":true,"id":"lesson-27"},{"section":"fraud","title":"Practice: “leave yourself clocked in”","points":[],"narration":"Practice: “leave yourself clocked in”. A participant says you may leave for your second job but should stay clocked in because they do not need help right now. What should you do? Option 1. Stay clocked in because the participant agreed. Option 2. Ask a staff member to clock you out at the scheduled end. Option 3. Follow the coverage plan, contact the office about the change, and record the actual service end. Option 4. Write a progress note about tasks you planned to do. Choose your answer on the screen.","kind":"check","question":{"prompt":"A participant says you may leave for your second job but should stay clocked in because they do not need help right now. What should you do?","options":["Stay clocked in because the participant agreed","Ask a staff member to clock you out at the scheduled end","Follow the coverage plan, contact the office about the change, and record the actual service end","Write a progress note about tasks you planned to do"],"answer":2,"explanation":"The participant’s permission does not authorize a false service claim. Follow the safety and coverage plan and record only actual service time."},"sources":["abuse","ocdd"],"id":"lesson-28"},{"section":"fraud","title":"AG example: travel conflicts with visit records","points":["The AG reported a DSW arrest in September 2026.","Investigators described travel conflicting with claimed visits.","Lesson: service logs must match where and when care occurred."],"narration":"AG example: travel conflicts with visit records. In the Sharon Molden announcement, the Attorney General described alleged DSW service records that conflicted with travel outside Louisiana. Investigators reviewed social-media posts and obtained records to verify a trip. Molden is presumed innocent, and the announcement describes an ongoing investigation. The training point concerns truthful service documentation. A visit cannot be supported by writing a log when the staff member was elsewhere and did not provide the care.","kind":"lesson","sources":["molden"],"case":true,"id":"lesson-29"},{"section":"fraud","title":"AG example: the recipient was elsewhere","points":["The AG reported a DSW arrest in August 2026.","The allegations involved care claimed during incarceration and school hours.","Lesson: tell the office when circumstances interrupt scheduled services."],"narration":"AG example: the recipient was elsewhere. The Attorney General announced the August twenty-fourth arrest of Mauricio Cordoba, a DSW and the recipient's father. The report describes alleged claims during periods when the recipient was incarcerated or at school, totaling six thousand seven hundred twenty-two dollars and seventy-five cents. Cordoba is presumed innocent. Being related to a participant does not remove the need for accurate documentation. Report changes that affect scheduled services rather than assuming the scheduled hours can still be claimed.","kind":"lesson","sources":["cordoba"],"case":true,"id":"lesson-30"},{"section":"fraud","title":"AG example: daily logs for care not delivered","points":["The AG reported a caretaker arrest in March 2026.","The allegation concerned activity logs for services not performed.","Lesson: a signed log must be supported by actual care."],"narration":"AG example: daily logs for care not delivered. The Attorney General's March thirty-first announcement concerned Mylanta Denise Cephus, a former personal-care caretaker. The report alleges false daily activity logs supporting sixty-eight thousand four hundred eighty-six dollars and seventy-three cents in Medicaid billing. Cephus is presumed innocent. This case connects documentation to billing. A completed log cannot establish that a service happened when the care was never delivered. Write the real activities and report missed services honestly.","kind":"lesson","sources":["cephus"],"case":true,"id":"lesson-31"},{"section":"fraud","title":"Consequences and reporting","points":["Louisiana’s Medicaid fraud statute allows up to five years in prison, a fine up to $20,000, or both.","Other charges, repayment, exclusion, or employment action may also apply.","Report suspected fraud to the office and the proper authorities.","MFCU: 1-888-799-6885 or 225-326-6210."],"narration":"Consequences and reporting. Louisiana Revised Statutes fourteen, seventy point one provides a criminal penalty of up to five years in prison, a fine up to twenty thousand dollars, or both. The actual consequences depend on the conduct and case. The supplied training also describes possible employment action and exclusion from publicly funded healthcare work. Report concerns honestly. The Attorney General's Medicaid Fraud Control Unit lists one eight eight eight, seven nine nine, six eight eight five, and two two five, three two six, six two one zero. Preserve relevant records and avoid altering or destroying evidence.","kind":"lesson","sources":["law","abuse","agunit"],"id":"lesson-32"},{"section":"fraud","title":"Practice: a time-entry mistake","points":[],"narration":"Practice: a time-entry mistake. You realize you forgot to clock out yesterday. What is the appropriate response? Option 1. Guess the scheduled end time and sign whatever the office enters. Option 2. Tell the office promptly, provide the actual end time and reason, and complete the required supporting forms. Option 3. Ask the participant to say you stayed later. Option 4. Delete the visit and create a different one without telling anyone. Choose your answer on the screen.","kind":"check","question":{"prompt":"You realize you forgot to clock out yesterday. What is the appropriate response?","options":["Guess the scheduled end time and sign whatever the office enters","Tell the office promptly, provide the actual end time and reason, and complete the required supporting forms","Ask the participant to say you stayed later","Delete the visit and create a different one without telling anyone"],"answer":1,"explanation":"A missed clock-out needs a truthful, supported correction. Do not guess, backdate a signature, or ask someone to confirm a visit time that is not accurate."},"sources":["daily","weekly","ocdd"],"id":"lesson-33"},{"section":"document","title":"Documentation that centers the person","points":["Connect the note to the person’s current plan of care.","Describe the support you provided and the person’s response.","Show choices, independence, progress, and barriers."],"narration":"Documentation that centers the person. Person-centered documentation explains what happened for this particular person. Read the current service plan so you know the assigned supports and personal goals. A note should show what you did, what the person did, and how the support related to the plan. Describe the person's choices and independence as well as the help they needed. A goal may not be met on every shift. Record the reason and the support you offered rather than making the day sound perfect.","kind":"lesson","sources":["docdeck","ocdd"],"id":"lesson-34"},{"section":"document","title":"Facts are more useful than labels","points":["Describe what you saw and heard.","Use the person’s own words when relevant.","Explain your response and any notification.","Avoid labels such as lazy, difficult, or bad."],"narration":"Facts are more useful than labels. A useful note gives another reader something they can understand and act on. Instead of saying the person was lazy, describe the activity offered, the person's response, and the help you provided. For example: At nine fifteen, I offered assistance with bathing. Ms. Lee said she wanted to bathe after breakfast. I offered again at ten, and she accepted help preparing the towels. Include a direct statement only when it matters to care. Do not use the note to criticize a participant or another staff member.","kind":"lesson","sources":["docdeck"],"id":"lesson-35"},{"section":"document","title":"Practice: choose the factual entry","points":[],"narration":"Practice: choose the factual entry. Which entry gives the most useful, objective information? Option 1. He was difficult and had a bad day. Option 2. She is always lazy about getting dressed. Option 3. At 8:20 a.m. Ms. Lee declined dressing assistance and said she wanted to rest. I offered again at 9 a.m. and she chose clean clothes with one reminder.. Option 4. Everything was fine as usual. Choose your answer on the screen.","kind":"check","question":{"prompt":"Which entry gives the most useful, objective information?","options":["He was difficult and had a bad day","She is always lazy about getting dressed","At 8:20 a.m. Ms. Lee declined dressing assistance and said she wanted to rest. I offered again at 9 a.m. and she chose clean clothes with one reminder.","Everything was fine as usual"],"answer":2,"explanation":"The factual entry identifies times, the person’s choice, the DSW’s action, and the response. Labels and vague statements do not describe the actual care."},"sources":["docdeck"],"id":"lesson-36"},{"section":"document","title":"A clear note answers the care questions","points":["Who received the support and who provided it?","What happened, when, and where?","How much assistance was needed?","What was the response, outcome, or next step?"],"narration":"A clear note answers the care questions. Use short, complete sentences in plain language. Identify the person, the date or shift, and the support. Describe the kind of help, such as a verbal reminder, setup, standby support, or hands-on assistance, when that matches what occurred. Then explain the person's response and any needed follow-up. Words such as assisted with daily activities do not show what you actually did. Another staff member should be able to understand the note without asking you to translate unexplained abbreviations or slang.","kind":"lesson","sources":["docdeck","ocdd"],"id":"lesson-37"},{"section":"document","title":"Actual events and actual times","points":["Document promptly after the care occurs.","Keep service dates and times consistent across records.","Never prefill future care or copy another person’s note.","Report discrepancies instead of making records falsely agree."],"narration":"Actual events and actual times. Write your note while you can accurately remember the shift. Do not document a bath, visit, or goal before it happens. Do not copy yesterday's note or another DSW's account and change the date. Service logs, progress notes, and visit records should reflect the same actual events. If a record does not match, report the discrepancy and follow the correction procedure. Making two incorrect records agree does not make either one accurate. A late entry must be identified truthfully under agency procedure.","kind":"lesson","sources":["docdeck","ocdd","oaas"],"id":"lesson-38"},{"section":"document","title":"When a person declines support","points":["Document the support offered and the person’s response.","Describe alternatives, later attempts, or help requested.","Follow the plan for health or safety concerns.","Never mark a task completed when it was declined."],"narration":"When a person declines support. A person can make choices about daily activities. When support is declined, write what was offered, the response, and what happened next. Explain whether you offered a different time, another approach, or notified a supervisor because the plan required it. Keep the language respectful. Do not invent compliance or label the person as uncooperative. If the refusal creates a health or safety concern, use the care plan and reporting process. The task section must also reflect that the service was not completed.","kind":"lesson","sources":["docdeck","oaas","ocdd"],"id":"lesson-39"},{"section":"document","title":"Correcting a record","points":["Keep the original information readable.","For OAAS paper logs: one line, “error,” your initials, and the correct entry.","Only the person who made the OAAS entry corrects it.","For electronic or late entries, follow the agency’s audit-trail procedure."],"narration":"Correcting a record. The OAAS instructions give a specific paper correction method. The person who made the entry draws one line through the mistake, writes error above it, initials the correction, and enters the right information. Leave the original readable. Do not erase, use correction fluid, scribble it out, or sign for another staff member. Follow agency procedures for documenting when a correction is made. An electronic correction needs the approved process and a record of the change. If documentation is late, do not pretend it was written earlier.","kind":"lesson","sources":["oaas","docdeck","ocdd"],"id":"lesson-40"},{"section":"document","title":"Privacy and medical-visit information","points":["Share information only through approved care and reporting channels.","Use the approved medical-visit form when required.","Clarify instructions and follow-up before leaving an appointment.","Report changes to the office or nurse as directed."],"narration":"Privacy and medical-visit information. Progress notes are part of the person's care record. Keep them secure and discuss the person only with people who are authorized to receive the information. Do not post photos of forms or participant details on social media. After a medical or behavioral-health appointment, complete the agency's required report and obtain the appropriate provider information or signature. Clarify instructions you do not understand. Share medication changes or follow-up needs through the office or nurse. Record what was recommended without independently changing treatment.","kind":"lesson","sources":["docdeck","ocdd"],"id":"lesson-41"},{"section":"document","title":"Practice: an entry needs correction","points":[],"narration":"Practice: an entry needs correction. You initialed the wrong OAAS task box. What should you do? Option 1. Erase it so the form looks neat. Option 2. Ask a staff member to replace your initials. Option 3. Use the OAAS correction process and keep the original entry readable. Option 4. Leave it because one small mistake does not matter. Choose your answer on the screen.","kind":"check","question":{"prompt":"You initialed the wrong OAAS task box. What should you do?","options":["Erase it so the form looks neat","Ask a staff member to replace your initials","Use the OAAS correction process and keep the original entry readable","Leave it because one small mistake does not matter"],"answer":2,"explanation":"The entry’s author corrects the OAAS paper record with a single line, “error,” initials, and the accurate information. Use the office’s procedure for any additional correction documentation."},"sources":["oaas"],"id":"lesson-42"},{"section":"oaas","title":"Three forms with different jobs","points":["CCW PAS log: OAAS weekly task record and notes.","LT-PCS log: OAAS weekly task record and notes.","OCDD single-shift note: a different daily documentation form.","Confirm the participant’s program before choosing paperwork."],"narration":"Three forms with different jobs. OAAS means the Office of Aging and Adult Services. This course covers Community Choices Waiver personal assistance services, called CCW PAS, and Long Term Personal Care Services, called LT-PCS. Each uses its own service log. The OCDD daily progress note is a separate form and has different completion rules. Confirm the participant's assigned program with the office. A familiar-looking form is not enough.","kind":"lesson","sources":["oaas","ccw","ltpcs","ocdd"],"comparison":"programs","id":"lesson-43"},{"section":"oaas","title":"The OAAS weekly header","points":["Confirm provider, DSW, participant, and date of birth.","Enter the correct Week Of and Through dates.","The authorization week runs Sunday through Saturday.","Place each service date under the correct weekday."],"narration":"The OAAS weekly header. The weekly header identifies whose services the log describes. Confirm the provider, your printed name, the participant's name, and date of birth. Check the week beginning and ending dates. The supplied OAAS instructions define the prior-authorization week as Sunday at midnight through Saturday at eleven fifty-nine p.m. Enter the correct date under each applicable day. Provider staff may prepare identifying information, but you remain responsible for checking the log before recording your care. Each DSW completes their own log for the participant served.","kind":"lesson","sources":["oaas","ccw","ltpcs"],"form":"ccw1","id":"lesson-44"},{"section":"oaas","title":"Daily task initials","points":["Enter your signed initials for tasks actually performed that day.","Complete entries on the day the task occurs.","Leave a task box blank when that task was not performed.","EVV captures visit times and check-in/out location."],"narration":"Daily task initials. For OAAS service logs, your signed initials in a task box mean that you performed that task on that date. Fill in the actual tasks each day. If you did not perform the task, leave its box blank under these instructions. Do not use the entire column as a general sign-in. Do not fill the week ahead or wait until the end of the week to reconstruct all the tasks. EVV separately records visit times and location. The task initials and EVV serve different documentation purposes.","kind":"lesson","sources":["oaas","ccw","ltpcs"],"form":"ltpcs1","id":"lesson-45"},{"section":"oaas","title":"Practice: a task was not performed","points":[],"narration":"Practice: a task was not performed. On Tuesday you assisted with grooming, but you did not provide bathing assistance. How should the OAAS task grid show this? Option 1. Initial both boxes because you were present. Option 2. Initial Tuesday’s grooming box and leave Tuesday’s bathing box blank. Option 3. Write EVV across the whole column. Option 4. Ask the participant to initial the bathing box. Choose your answer on the screen.","kind":"check","question":{"prompt":"On Tuesday you assisted with grooming, but you did not provide bathing assistance. How should the OAAS task grid show this?","options":["Initial both boxes because you were present","Initial Tuesday’s grooming box and leave Tuesday’s bathing box blank","Write EVV across the whole column","Ask the participant to initial the bathing box"],"answer":1,"explanation":"The OAAS instructions require the DSW’s signed initials beside each task actually performed. A task not performed is left blank on this task grid."},"sources":["oaas"],"form":"ltpcs1","id":"lesson-46"},{"section":"oaas","title":"Using the CCW PAS log","points":["Use the log labeled Community Choices Waiver PAS.","The supplied form includes additional PAS task rows.","A listed task still requires authorization and appropriate training.","Document only the support actually delivered."],"narration":"Using the CCW PAS log. The CCW PAS log includes the common daily-care rows and additional rows for protective supervision, supervision or assistance with health tasks, community tasks, and extension of therapy services. Their appearance on the blank form does not give every staff member permission to provide them for every participant. Follow the current plan, your training, and agency direction. Initial a row only for care you actually delivered. Bring an unfamiliar task or a mismatch between the form and the care plan to the office.","kind":"lesson","sources":["ccw","oaas"],"form":"ccw1","id":"lesson-47"},{"section":"oaas","title":"Using the LT-PCS log","points":["Use the log labeled Long Term Personal Care Services.","Match tasks to the participant’s authorized services.","Follow the same daily-initial and weekly-signature instructions.","Ask the office about any program or task mismatch."],"narration":"Using the LT-PCS log. The supplied LT-PCS form has a different title and task list from the CCW PAS form. It includes personal-care activities, household support, medication reminders, and listed appointment-related assistance. Use the person's authorized plan to determine what you provide. The general OAAS log instructions still apply: your own task entries each day and the required signatures after the week's work is complete. Do not add a CCW-only task to this form simply because you saw it on another participant's paperwork.","kind":"lesson","sources":["ltpcs","oaas"],"form":"ltpcs1","id":"lesson-48"},{"section":"oaas","title":"OAAS progress notes and handoff information","points":["Use page 2 for applicable changes and important care information.","Date each entry and describe observations and your response.","Duplicate the notes page when more space is needed.","Follow any additional agency documentation requirements."],"narration":"OAAS progress notes and handoff information. The OAAS notes page focuses on observed changes in physical or mental condition and important information for the next staff member or caregiver. For example, describe a new complaint, a change in the assistance needed, what you did, and whom you notified. Use the applicable date and identify facts. The state form says to use this notes page as applicable. Do not carry over OCDD's every-shift narrative rule as the OAAS form instruction. Follow any additional requirements the agency gives you.","kind":"lesson","sources":["oaas","ccw","ltpcs"],"form":"ccw2","id":"lesson-49"},{"section":"oaas","title":"End-of-week signatures and page numbers","points":["Obtain the participant or authorized representative’s signature and date.","The DSW signs and dates after the week’s work is complete.","Both parties initial and date each applicable notes page.","Number all pages in the weekly record."],"narration":"End-of-week signatures and page numbers. The OAAS instructions place the final signatures after the week's documentation is complete. The participant or the appropriate responsible or legal representative signs and dates the main log. The DSW also signs and dates it. Do not obtain a signature on an unfinished future week. On each applicable narrative page, the same participant or representative initials and dates, and the DSW initials and dates. Number the pages so the office can tell whether the record is complete. Ask the office for instructions if the authorized signer is unavailable.","kind":"lesson","sources":["oaas","ccw","ltpcs"],"form":"ltpcs2","id":"lesson-50"},{"section":"oaas","title":"Practice: signing early","points":[],"narration":"Practice: signing early. A family member offers to sign next week’s OAAS log now so you do not have to ask later. What should you do? Option 1. Accept because it saves time. Option 2. Ask them to sign a blank form instead. Option 3. Explain that the required signature follows completion of that week’s work and ask the office about any difficulty obtaining it. Option 4. Sign the family member’s name yourself. Choose your answer on the screen.","kind":"check","question":{"prompt":"A family member offers to sign next week’s OAAS log now so you do not have to ask later. What should you do?","options":["Accept because it saves time","Ask them to sign a blank form instead","Explain that the required signature follows completion of that week’s work and ask the office about any difficulty obtaining it","Sign the family member’s name yourself"],"answer":2,"explanation":"The OAAS log is signed after the week’s work and documentation are complete. Never obtain a signature confirming future services or sign for another person."},"sources":["oaas"],"id":"lesson-51"},{"section":"ocdd","title":"OCDD: one staff member, one participant, one shift","points":["Use the agency’s single-shift form for each shift.","Each DSW documents their own services.","Use a separate note for each beneficiary receiving shared supports.","This section reinforces the previous OCDD progress-note training."],"narration":"OCDD: one staff member, one participant, one shift. This section reinforces our previous OCDD training using the current single shift for a single date of service form. It covers one staff member, one beneficiary, and one continuous shift. Each staff member documents their own care. Shared supports require separate documentation for each beneficiary, and two staff members supporting one person each prepare their own note. This course does not teach the multiple-shift form. The goals remain the same as in the earlier training: an accurate account of services, meaningful support details, and progress toward the person's outcomes.","kind":"lesson","sources":["ocdd","ocddform","ocddprior"],"form":"ocdd1","id":"lesson-52"},{"section":"ocdd","title":"Identification, visit times, and location","points":["Identify the beneficiary, date of service, and staff member.","Print your name and sign your own entry.","When EVV captures a time, use EVV in the corresponding time field.","For manual times, record the exact time with a.m./p.m. and Home or Other."],"narration":"Identification, visit times, and location. Check the agency information and enter the beneficiary's name and date of service. Print your name and sign. If you clocked in and out electronically, the form allows EVV in the time fields. If an in or out time requires manual entry, record that actual time with a.m. or p.m. and identify Home or Other for the service location. A manual entry is not EVV. Explain any later time change through the required supporting documentation. Do not put EVV in a field that was not actually captured electronically.","kind":"lesson","sources":["ocdd","ocddform"],"form":"ocdd1","id":"lesson-53"},{"section":"ocdd","title":"The top four sections","points":["Relationship support and community connections.","Education, work, and social roles.","Appointments.","Challenges today."],"narration":"The top four sections. On the single-shift form, check the applicable items in these four sections. Describe the actual relationship or community activity and whether staff support was provided. Identify education, work, or social-role support that occurred during your shift. For appointments, include the type of visit, instructions, and follow-up when relevant. Under challenges, identify symptoms, incidents, medication concerns, plans followed, and people contacted. The checkmarks need details in the progress-note area. Checking a box alone does not explain the person's experience or your support.","kind":"lesson","sources":["ocdd","ocddform"],"form":"ocdd1","id":"lesson-54"},{"section":"ocdd","title":"ADL and IADL assistance needs a description","points":["Write what help you provided in each applicable area.","State when the person completed an activity independently.","Identify another helper’s name or role when relevant.","Use N/A when the activity did not occur during the shift."],"narration":"ADL and IADL assistance needs a description. In the assistance-provided section, describe the kind of support rather than using a checkmark alone. For example: Set out towels and soap; Ms. Lee washed independently with one reminder to rinse her hair. If another person provided the assistance, identify that person's name or role and what support they gave. If an activity did not occur on your shift, indicate not applicable as directed in the OCDD training. Do not leave the reader guessing whether the activity was independent, assisted, or did not happen.","kind":"lesson","sources":["ocdd","ocddform"],"form":"ocdd1","id":"lesson-55"},{"section":"ocdd","title":"Practice: describing support","points":[],"narration":"Practice: describing support. Which entry best fits the OCDD ADL/IADL assistance section? Option 1. Checkmark. Option 2. Good. Option 3. Set out clean clothes. Mr. Lee dressed independently and needed one verbal reminder to fasten his shirt.. Option 4. Same as yesterday. Choose your answer on the screen.","kind":"check","question":{"prompt":"Which entry best fits the OCDD ADL/IADL assistance section?","options":["Checkmark","Good","Set out clean clothes. Mr. Lee dressed independently and needed one verbal reminder to fasten his shirt.","Same as yesterday"],"answer":2,"explanation":"The description tells what the staff member did, what the person did independently, and the assistance needed. A checkmark alone does not provide those details."},"sources":["ocdd"],"id":"lesson-56"},{"section":"ocdd","title":"A narrative is required every shift","points":["Complete the progress-note area on page 1.","Explain items checked in the top sections.","Describe support toward goals in the CPOC.","Include changes, challenges, actions, and responses."],"narration":"A narrative is required every shift. The OCDD training requires progress notes for every shift, even when the shift feels routine. Complete the narrative area on page one of the single-shift form. Explain relevant checked activities and support toward the goals in the current comprehensive plan of care, or CPOC. Include meaningful observations, your
